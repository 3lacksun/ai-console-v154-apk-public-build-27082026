name: Precision v1.5.4 Runtime Acceptance

on:
  push:
    branches:
      - precision-authoritative-apk-02092026
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: precision-v154-runtime-acceptance
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_SHA256: 474fa005fbb3f5c320aa3a129fc2cf26500ef4da6d000143d7cd75aec1183258
      PKG: com.nexarenew.aiconsole
    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download exact verified APK from successful carrier run 2
        uses: actions/download-artifact@v4
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG
          path: runtime-apk
          github-token: ${{ github.token }}
          repository: 3lacksun/ai-console-v154-apk-public-build-27082026
          run-id: 33681949327

      - name: Verify downloaded APK hash identity signing bundle and 16 KB binary alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=runtime-apk/DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG.apk
          test -s "$APK"
          echo "$APK_SHA256  $APK" | sha256sum -c -
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;36.0.0'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.nexarenew.aiconsole' versionCode='19' versionName='1.5.4'"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee APK_SIGNING_RUNTIME.txt
          unzip -l "$APK" | grep -F 'assets/index.android.bundle'
          rm -rf /tmp/apk-native && mkdir -p /tmp/apk-native
          unzip -q "$APK" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d /tmp/apk-native
          count=0
          while IFS= read -r so; do
            count=$((count+1))
            while IFS= read -r align; do
              if (( align < 0x4000 )); then
                echo "64-bit ELF alignment below 16 KB: $so $align" >&2
                exit 1
              fi
            done < <(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}')
          done < <(find /tmp/apk-native/lib/arm64-v8a /tmp/apk-native/lib/x86_64 -type f -name '*.so' | sort)
          test "$count" -gt 0
          echo "BINARY_16KB_ALIGNMENT=PASS libraries=$count"

      - name: Android 16 API 36 cold-launch acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK=runtime-apk/DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG.apk
            adb install -r "$APK"
            ACTIVITY="$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -1)"
            echo "ACTIVITY=$ACTIVITY"
            test -n "$ACTIVITY"
            adb shell am force-stop "$PKG"
            adb logcat -c
            adb shell am start -W -n "$ACTIVITY"
            sleep 15
            adb shell pidof "$PKG"
            adb shell dumpsys activity activities | grep -F "$PKG" | head -20
            if adb logcat -d -v brief AndroidRuntime:E ReactNativeJS:E '*:S' | grep -F "$PKG"; then
              echo 'Runtime fatal/error log associated with package' >&2
              exit 1
            fi
            echo 'ANDROID_16_COLD_LAUNCH=PASS'

      - name: Android 16 KB page-size cold-launch acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK=runtime-apk/DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG.apk
            PAGE_SIZE="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
            echo "PAGE_SIZE=$PAGE_SIZE"
            test "$PAGE_SIZE" = '16384'
            adb install -r "$APK"
            ACTIVITY="$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -1)"
            echo "ACTIVITY=$ACTIVITY"
            test -n "$ACTIVITY"
            adb shell am force-stop "$PKG"
            adb logcat -c
            adb shell am start -W -n "$ACTIVITY"
            sleep 15
            adb shell pidof "$PKG"
            adb shell dumpsys activity activities | grep -F "$PKG" | head -20
            if adb logcat -d -v brief AndroidRuntime:E ReactNativeJS:E '*:S' | grep -F "$PKG"; then
              echo 'Runtime fatal/error log associated with package on 16 KB image' >&2
              exit 1
            fi
            echo 'ANDROID_16KB_COLD_LAUNCH=PASS'

      - name: Upload runtime acceptance evidence
        uses: actions/upload-artifact@v6
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_RUNTIME_ACCEPTANCE_EVIDENCE
          path: APK_SIGNING_RUNTIME.txt
          if-no-files-found: error
          retention-days: 14
