name: Code Dump Tool v1.2.1 FIX002 UI Screen APK Build

on:
  push:
    branches: [ codedump-v121-fix002-ui-screen-build-05102026 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codedump-v121-ui-screen-fix002-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0a8c-8210-aca6-bdc3b2bd5339/raw?se=2026-10-05T01%3A05%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=db254408-7a37-57f1-bc9c-dbb86be0d1e4&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A55%3A10Z&ske=2026-10-05T17%3A55%3A10Z&sks=b&skv=2026-02-06&sig=SDyVNL/9ngiIpx%2B2A%2BFpNlMGi06RCl8pht/4TOd4TY0%3D"
  SOURCE_SHA256: "e26ba5784624f00dbab1127d0aac575d823ecd6b42c91feed1bb0fa6661e0226"

jobs:
  build:
    name: Verify FIX002 UI source and build APK/AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Download exact FIX002 build-ready source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codedump-v121-ui
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/codedump-v121-ui/source.zip
          echo "$SOURCE_SHA256  /tmp/codedump-v121-ui/source.zip" | sha256sum -c -
          unzip -q /tmp/codedump-v121-ui/source.zip -d /tmp/codedump-v121-ui/source
          ROOT="$(find /tmp/codedump-v121-ui/source -mindepth 1 -maxdepth 1 -type d -name 'CODE_DUMP_V1_2_1_FIX002_UI_SCREEN_APK_READY_*' | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm ci --no-audit --no-fund
          node -e "for (const [p,v] of [['@capacitor/core','8.5.0'],['@capacitor/android','8.5.0'],['@capacitor/cli','8.5.0']]) if(require('./node_modules/'+p+'/package.json').version!==v) process.exit(1)"

      - name: Verify source package
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          sha256sum -c SOURCE_SHA256SUMS.txt
          npm test

      - name: Materialise Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run android:prepare
          test -f android/gradlew
          grep -q "versionCode 121" android/app/build.gradle
          grep -q 'versionName "1.2.1"' android/app/build.gradle
          grep -q "gradle-8.14.3-all.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Test, lint and build Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT/android"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease

      - name: Stage build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$ROOT/android/app/build/outputs/apk/debug/app-debug.apk" artifacts/
          find "$ROOT/android/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -exec cp {} artifacts/ \;
          find "$ROOT/android/app/build/outputs/bundle/release" -maxdepth 1 -type f -name '*.aab' -exec cp {} artifacts/ \;
          {
            echo "Code Dump Tool 1.2.1 — FIX002 UI screen remediated"
            echo "Application ID: app.codedump.tool"
            echo "Version code: 121"
            echo "Audit Pack Generator: 1.2.2"
            echo "Source ZIP SHA-256: $SOURCE_SHA256"
            echo "Carrier repository: $GITHUB_REPOSITORY"
            echo "Carrier commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Capacitor: 8.5.0"
            echo "AGP: 8.13.2"
            echo "Kotlin: 2.3.20"
            echo "Java: 21"
            echo "Android: API 36 / Build Tools 36.0.0"
          } > artifacts/BUILD_INFO.txt
          (cd artifacts && sha256sum *.apk *.aab BUILD_INFO.txt | sort > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-dump-v1.2.1-fix002-ui-screen-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-dump-v1.2.1-fix002-ui-screen-failure-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.ROOT }}/android/app/build/reports/
            ${{ env.ROOT }}/android/app/build/test-results/
            ${{ env.ROOT }}/android/app/build/outputs/logs/
