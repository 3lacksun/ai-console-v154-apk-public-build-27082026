name: Code Dump Tool Mobile Flow Hotfix APK

on:
  push:
    branches: [ codedump-mobile-flow-hotfix-03092026 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codedump-mobile-flow-hotfix-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    name: Verify mobile flow hotfix and build APK/AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialise last green production source
        shell: bash
        run: |
          set -euo pipefail
          cd codedump
          cat overlay-chunks/overlay.{00..13} overlay-chunks/overlay.14a overlay-chunks/overlay.14b overlay-chunks/overlay.14c overlay-chunks/overlay.{15..17} > /tmp/codedump-green-overlay.tar.gz.b64
          test "$(wc -c < /tmp/codedump-green-overlay.tar.gz.b64)" -eq 104336
          test "$(sha256sum /tmp/codedump-green-overlay.tar.gz.b64 | awk '{print $1}')" = "06d888899f0a3f67ca4254aef7fc81af9d9c9eeaf90205791fdb204c87082a67"
          base64 --decode /tmp/codedump-green-overlay.tar.gz.b64 > /tmp/codedump-green-overlay.tar.gz
          test "$(wc -c < /tmp/codedump-green-overlay.tar.gz)" -eq 78250
          test "$(sha256sum /tmp/codedump-green-overlay.tar.gz | awk '{print $1}')" = "b3028e80b7cac2308c105337c020d3a66ecde12e3dfa094ca6f6bdbe18d7e87f"
          tar -tzf /tmp/codedump-green-overlay.tar.gz >/dev/null
          tar -xzf /tmp/codedump-green-overlay.tar.gz

      - name: Apply verified AuditSkill remediation baseline
        shell: bash
        run: |
          set -euo pipefail
          cat codedump/audit-remediation/patch.00 codedump/audit-remediation/patch.01 > /tmp/remediation.patch.gz.b64
          test "$(wc -c < /tmp/remediation.patch.gz.b64)" -eq 9984
          test "$(sha256sum /tmp/remediation.patch.gz.b64 | awk '{print $1}')" = "7d6f628d146943a08932de83954255ebd0d0585866c17a814cc70868bbb6d19c"
          base64 --decode /tmp/remediation.patch.gz.b64 > /tmp/remediation.patch.gz
          test "$(wc -c < /tmp/remediation.patch.gz)" -eq 7486
          test "$(sha256sum /tmp/remediation.patch.gz | awk '{print $1}')" = "7769f3228fec5ce23da8090dcaf43c39ca9dd83796154309323674d7a44671b0"
          gzip -dc /tmp/remediation.patch.gz > /tmp/remediation.patch
          test "$(sha256sum /tmp/remediation.patch | awk '{print $1}')" = "7ed2931c02df50f9412b25bcd9a8b36207019d65eb0da90dfd2f6558b04f338c"
          git apply --check --directory=codedump /tmp/remediation.patch
          git apply --directory=codedump /tmp/remediation.patch
          cd codedump
          test "$(sha256sum web/app.js | awk '{print $1}')" = "dd33453c335f7b53690a8afdf1662e9df8ced11a0aeeebfe82837bd75fbddabe"
          test "$(sha256sum web/app.css | awk '{print $1}')" = "0d3f2b033b5217b09030af6fae67ea674ea7627d093e8bde8684d04bf9fbd515"
          test "$(sha256sum web/archive-core.js | awk '{print $1}')" = "634f50c49cd597ee3a69ef049f2e4cb7e108e33f468a593a9b8f6849a6d11d07"
          grep -q "classifyLaunchFile" web/app.js
          ! grep -R "44px" web/app.css

      - name: Apply mobile extraction and review workflow hotfix
        shell: bash
        run: |
          set -euo pipefail
          cd codedump
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('web/app.js')
          css = Path('web/app.css')
          archive = Path('web/archive-core.js')
          sw = Path('web/sw.js')

          text = app.read_text(encoding='utf-8')

          # Keep the preflight decision/continue controls reachable even when the
          # nested-archive inventory is extremely long.
          needle = '<div class="actions two-col"><button id="cancelPreflight"'
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one preflight action row, found {text.count(needle)}')
          text = text.replace(
              needle,
              '<div class="actions two-col preflight-actions"><button id="cancelPreflight"',
              1,
          )

          # Replace the create review screen with a mobile workflow dock. The full
          # feature set remains on the same screen, but users can jump directly to
          # the next required stage without traversing the project tree.
          start = text.find('  function renderCreateWorkspace() {')
          end = text.find('\n  function render() {', start)
          if start < 0 or end < 0:
              raise SystemExit('renderCreateWorkspace boundary not found')
          old = text[start:end]
          if 'renderFileBrowser(\'create\')' not in old or 'renderDumpOutput()' not in old:
              raise SystemExit('Unexpected renderCreateWorkspace structure')

          new = '''  function renderCreateWorkspace() {
            const selected = selectedFiles().length;
            const unresolvedSecrets = state.files.filter(file => file.secretPolicy === 'review').length;
            const nextLabel = unresolvedSecrets
              ? `Review ${formatNumber(unresolvedSecrets)} secret finding${unresolvedSecrets === 1 ? '' : 's'}`
              : 'Continue to output';
            const nextHint = unresolvedSecrets ? 'Resolve required review before output' : 'Output is ready below';
            return `<section class="screen workspace create-workflow-screen"><div class="screen-heading"><span class="chip">Local project</span><h2>${escapeHtml(state.sourceLabel || 'Imported project')}</h2><p>Review selection, scan sensitive content locally, then export integrity-verifiable Code Dump v3 text or v4 lossless output.</p></div>${renderMetrics()}
              <div class="mobile-workflow-dock" role="region" aria-label="Create workflow next action"><div class="mobile-workflow-dock-copy"><strong>${formatNumber(selected)} selected</strong><span>${escapeHtml(nextHint)}</span></div><button id="createNextAction" class="btn primary" type="button">${escapeHtml(nextLabel)}</button></div>
              <div id="createSecretStage" class="create-stage">${renderSecretReviewCentre()}</div>
              <div id="createReviewStage" class="create-stage"><div class="two-col workspace">${renderFileBrowser('create')}${renderPreview()}</div></div>
              <div id="createOutputStage" class="create-stage create-output-stage">${renderRoundTripVerification()}${renderDumpOutput()}</div>
              ${renderWarnings()}<button id="startOverCreate" class="btn text full-span" type="button">Import another project</button></section>`;
          }
'''
          text = text[:start] + new + text[end:]

          # Bind the dock to the next actionable stage. Respect reduced motion.
          bind_anchor = "    const runRoundTrip = $('runRoundTrip'); if (runRoundTrip) runRoundTrip.addEventListener('click', runRoundTripVerification);"
          if text.count(bind_anchor) != 1:
              raise SystemExit(f'Expected one runRoundTrip binding, found {text.count(bind_anchor)}')
          bind_replacement = bind_anchor + "\n    const createNextAction = $('createNextAction'); if (createNextAction) createNextAction.addEventListener('click', () => { const unresolved = state.files.some(file => file.secretPolicy === 'review'); const target = $(unresolved ? 'createSecretStage' : 'createOutputStage'); if (target) target.scrollIntoView({ behavior: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' }); });"
          text = text.replace(bind_anchor, bind_replacement, 1)
          app.write_text(text, encoding='utf-8')

          # More frequent progress messages avoid a visually frozen extraction on
          # large projects; the main thread already throttles rendering.
          atext = archive.read_text(encoding='utf-8')
          old_progress = "if (stats.textFiles % 10 === 0) report(progress, 'extract', stats, outputPath, depth);"
          if old_progress in atext:
              atext = atext.replace(old_progress, "report(progress, 'extract', stats, outputPath, depth);", 1)
          old_preflight = "if (stats.entriesScanned % 20 === 0) report(progress, 'preflight', stats, outputPath, depth);"
          if old_preflight in atext:
              atext = atext.replace(old_preflight, "if (stats.entriesScanned % 5 === 0) report(progress, 'preflight', stats, outputPath, depth);", 1)
          archive.write_text(atext, encoding='utf-8')

          css_append = r'''

          /* 2026-09-03 mobile workflow remediation: keep progression controls
             reachable and make long project inventories scroll locally. */
          .mobile-workflow-dock { display:none; }
          .create-stage { scroll-margin-top:84px; }
          .preflight-actions { isolation:isolate; }

          @media (max-width: 720px) {
            .screen.workspace,
            .screen:has(.preflight-actions) {
              padding-bottom:calc(148px + env(safe-area-inset-bottom, 0px));
            }
            .mobile-workflow-dock {
              position:fixed;
              display:flex;
              align-items:center;
              gap:12px;
              left:12px;
              right:12px;
              bottom:calc(76px + env(safe-area-inset-bottom, 0px));
              z-index:80;
              padding:10px 10px 10px 14px;
              border:1px solid var(--outline-variant, #d9d5e2);
              border-radius:22px;
              background:color-mix(in srgb, var(--surface, #fff) 94%, transparent);
              box-shadow:0 10px 30px rgba(38,31,52,.18);
              backdrop-filter:blur(14px);
              -webkit-backdrop-filter:blur(14px);
            }
            .mobile-workflow-dock-copy {
              display:flex;
              min-width:0;
              flex:1;
              flex-direction:column;
              gap:2px;
            }
            .mobile-workflow-dock-copy strong,
            .mobile-workflow-dock-copy span {
              overflow:hidden;
              text-overflow:ellipsis;
              white-space:nowrap;
            }
            .mobile-workflow-dock-copy span { font-size:.78rem; opacity:.72; }
            .mobile-workflow-dock .btn { flex:0 0 auto; min-height:48px; }

            .preflight-actions {
              position:fixed;
              left:12px;
              right:12px;
              bottom:calc(76px + env(safe-area-inset-bottom, 0px));
              z-index:80;
              padding:10px;
              border:1px solid var(--outline-variant, #d9d5e2);
              border-radius:22px;
              background:color-mix(in srgb, var(--surface, #fff) 94%, transparent);
              box-shadow:0 10px 30px rgba(38,31,52,.18);
              backdrop-filter:blur(14px);
              -webkit-backdrop-filter:blur(14px);
            }

            .create-workflow-screen .file-list {
              max-height:min(50dvh, 520px);
              overflow-y:auto;
              overscroll-behavior:contain;
              scrollbar-gutter:stable;
            }
            .create-output-stage { scroll-margin-bottom:160px; }
          }

          @media (prefers-reduced-motion: reduce) {
            .mobile-workflow-dock,
            .preflight-actions { backdrop-filter:none; -webkit-backdrop-filter:none; }
          }
          '''
          ctext = css.read_text(encoding='utf-8')
          if '2026-09-03 mobile workflow remediation' in ctext:
              raise SystemExit('Mobile workflow CSS already present unexpectedly')
          css.write_text(ctext + css_append, encoding='utf-8')

          # Force the web/PWA surface to take the successor assets rather than a
          # stale cached copy when users test the same 1.1.0 version.
          stext = sw.read_text(encoding='utf-8')
          if '20260903-v1-1-capacitor-02' not in stext:
              raise SystemExit('Expected remediation cache identity not found')
          stext = stext.replace('20260903-v1-1-capacitor-02', '20260903-v1-1-capacitor-03', 1)
          sw.write_text(stext, encoding='utf-8')
          PY

          node --check web/app.js
          node --check web/archive-core.js
          grep -q 'mobile-workflow-dock' web/app.js
          grep -q 'createNextAction' web/app.js
          grep -q 'preflight-actions' web/app.js
          grep -q 'max-height:min(50dvh, 520px)' web/app.css
          grep -q '20260903-v1-1-capacitor-03' web/sw.js
          ! grep -R "44px" web/app.css
          sha256sum web/app.js web/app.css web/archive-core.js web/sw.js | tee /tmp/mobile-flow-source-sha256.txt

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Install pinned Capacitor and JSZip dependencies
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save jszip@3.10.1
          node -e "for (const [p,v] of [['@capacitor/core','8.5.0'],['@capacitor/android','8.5.0'],['@capacitor/cli','8.5.0'],['jszip','3.10.1']]) if(require('./node_modules/'+p+'/package.json').version!==v) process.exit(1)"
          mkdir -p web/vendor
          cp node_modules/jszip/dist/jszip.min.js web/vendor/jszip.min.js

      - name: Prepare Capacitor Android project
        working-directory: codedump
        run: node scripts/prepare-android.mjs

      - name: Verify generated Android hotfix project
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/src/main/java/app/codedump/tool/MainActivity.kt
          test -f android/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          grep -Fq 'android:mimeType="*/*"' android/app/src/main/AndroidManifest.xml
          grep -q "com.android.tools.build:gradle:8.13.2" android/build.gradle
          grep -q "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20" android/build.gradle
          grep -q "androidx.documentfile:documentfile:1.1.0" android/app/build.gradle
          grep -q "versionCode 2" android/app/build.gradle
          grep -q 'versionName "1.1.0"' android/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Run unit tests, lint and Android builds
        working-directory: codedump/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease

      - name: Stage mobile-flow hotfix artefacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp codedump/android/app/build/outputs/apk/debug/app-debug.apk artifacts/
          find codedump/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} artifacts/ \;
          find codedump/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} artifacts/ \;
          cp /tmp/mobile-flow-source-sha256.txt artifacts/MOBILE_FLOW_SOURCE_SHA256.txt
          {
            echo "Carrier repository: $GITHUB_REPOSITORY"
            echo "Carrier commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Code Dump version: 1.1.0"
            echo "Application ID: app.codedump.tool"
            echo "Baseline: audit-remediated 07:40 build line"
            echo "Mobile flow hotfix: fixed preflight next-action dock, create-review next-action dock, bounded mobile file-list scrolling, higher-frequency extraction progress"
            echo "Audit remediation retained: DEFECT-004, DEFECT-005, DEFECT-006, DEFECT-007 source closures"
            echo "Service-worker cache identity: 20260903-v1-1-capacitor-03"
            echo "Physical Android acceptance still required for device-only gates"
            echo "Capacitor: 8.5.0"
            echo "JSZip: 3.10.1"
            echo "AGP: 8.13.2"
            echo "Kotlin: 2.3.20"
            echo "Java: 21"
            echo "Android: API 36 / Build Tools 36.0.0"
          } > artifacts/BUILD_INFO.txt
          (cd artifacts && sha256sum *.apk *.aab BUILD_INFO.txt MOBILE_FLOW_SOURCE_SHA256.txt 2>/dev/null | sort > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload mobile-flow Android artefacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-dump-tool-mobile-flow-hotfix-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/

      - name: Upload mobile-flow failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-dump-tool-mobile-flow-hotfix-failure-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            codedump/android/app/build/reports/
            codedump/android/app/build/test-results/
            codedump/android/app/build/outputs/logs/
