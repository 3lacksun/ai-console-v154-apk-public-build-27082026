name: Recovery Integrity Reseal Once

on:
  push:
    branches:
      - ux-regression-recovery-03092026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reseal:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Repair recovery integrity seals'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux-regression-recovery-03092026
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Recalculate existing integrity manifests from branch contents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          manifests = [Path('HANDOVER_SHA256SUMS.txt'), Path('SHA256SUMS_EXEC002.txt')]
          pattern = re.compile(r'^([0-9a-fA-F]{64})(\s+)(.+)$')

          for manifest in manifests:
              if not manifest.is_file():
                  raise SystemExit(f'missing integrity manifest: {manifest}')
              output = []
              for line_no, raw in enumerate(manifest.read_text(encoding='utf-8').splitlines(), 1):
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      output.append(raw)
                      continue
                  match = pattern.match(raw)
                  if not match:
                      raise SystemExit(f'{manifest}:{line_no}: malformed checksum line')
                  filename = match.group(3)
                  target = Path(filename)
                  if not target.is_file():
                      raise SystemExit(f'{manifest}:{line_no}: sealed file missing: {filename}')
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  output.append(f'{digest}  {filename}')
              manifest.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Prove fail-closed static verification with repaired seals
        run: npm run check

      - name: Prove full source regression suite with repaired seals
        run: npm test

      - name: Validate diff and restrict commit to integrity manifests
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(HANDOVER_SHA256SUMS\.txt|SHA256SUMS_EXEC002\.txt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during integrity repair:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit repaired seals if required
        shell: bash
        run: |
          if git diff --quiet -- HANDOVER_SHA256SUMS.txt SHA256SUMS_EXEC002.txt; then
            echo 'Integrity manifests already match current recovery contents.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HANDOVER_SHA256SUMS.txt SHA256SUMS_EXEC002.txt
          git commit -m 'Repair recovery integrity seals'
          git push origin HEAD:ux-regression-recovery-03092026
