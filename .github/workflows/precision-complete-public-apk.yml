name: Precision Command Centre Complete Public APK

on:
  push:
    branches:
      - precision-command-centre-apk-public-r2-03092026
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  APK_NAME: "DR_STONES_COMMAND_CENTRE_v1.5.4_PRECISION_preview-debug-signed.apk"

jobs:
  build:
    name: Verify complete Precision handover and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact public build baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reconstruct and apply complete Precision handover patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/precision-complete/part-00.b64 \
              .ci/precision-complete/part-01.b64 \
              .ci/precision-complete/part-02.b64 \
              .ci/precision-complete/part-03.b64 > /tmp/precision-complete.xz.b64
          test -s /tmp/precision-complete.xz.b64
          base64 --decode /tmp/precision-complete.xz.b64 > /tmp/precision-complete.xz
          test -s /tmp/precision-complete.xz
          xz --test /tmp/precision-complete.xz
          xz --decompress --stdout /tmp/precision-complete.xz > /tmp/precision-complete.patch
          test -s /tmp/precision-complete.patch
          git apply --check /tmp/precision-complete.patch
          git apply /tmp/precision-complete.patch
          git status --short

      - name: Verify sealed Precision source bytes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/precision-files.sha256 <<'EOF'
          00085bb64cb812b8459401ff9df9384702ba646538892b59e1e51bd2267fd78d  App.js
          45a9ea2af407807fcba40a64073cae25514cf21db86391317ae80f450a594843  scripts/static-check.mjs
          fd340058b49c13e87890bd6a9314d543b7c72ce869bb1044caf099d9d1a88288  src/components/DocumentStudio.js
          9951ea3244d515a62c3275463d56e5bf2ab35dc4d5ae0355d72dec18be547544  src/components/FullVoiceScreen.js
          578ad7cea3136fb43332af3b947b5beea5c3170bd2df5d9d684a7bfacdbf53f9  src/components/Icons.js
          dd5752ba5c09e36b69fc76cfd2bc43391fb8c9271c091c728e2b2fae47b3b3e0  src/components/IntelligenceHub.js
          a7d05e792cacee8fae38e074fde5f56ab990ace03b62cc18db4fbdd40f30e276  src/components/LLMSettingsSheet.js
          eb786171d9becba4df94f498a4c1576d2930e71ecd6a396fc282ce58be6369b9  src/components/WorkspaceCommandOverview.js
          584caeeff24eb7e5cfd418086543418cd7e25d9f90d8f0411cf654a4af2e231e  src/theme.js
          ce79c5637b490f766cda9a17001db7a03a3e1472e470cb1cd7136a29ee9a2697  src/ui/motion.mjs
          36ede2de1529252fb2b986400f32b55e5a6d3295c2e54074168fec284f5cb5c4  src/ui/primitives.js
          41b57a17a300213d427b89ee9376386c1514547bd3ca2fe23953944204326926  src/ui/responsive.mjs
          fbf3fd5d6b1de82b3b823d999be0b997bcf712b2cdff0725348aab0a14f4e450  src/ui/tokens.js
          8773e9246c756d3dd2d6b5b9f83ffb9ef589680e96b9cb7bd46a036824101e43  tests/mobileLayoutSafety.test.mjs
          6acee1d24722ba75f31cd3e1d98220dad75b8fab790737496c810875c2521d9a  tests/precision-command-centre.test.mjs
          EOF
          sha256sum -c /tmp/precision-files.sha256
          test -f HANDOVER_SHA256SUMS.txt
          test -f SHA256SUMS_EXEC002.txt
          test "$(wc -l < HANDOVER_SHA256SUMS.txt)" -eq 275
          test "$(wc -l < SHA256SUMS_EXEC002.txt)" -eq 275

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Restore exact dependencies
        run: npm ci --no-fund

      - name: Verify application and complete handover integrity
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          node scripts/ci-version-guard.mjs
          node scripts/verify-runtime-contract.mjs
          npx expo install --check
          npx --yes expo-doctor@1.20.2

      - name: Install Android API 36 build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Generate Android project
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Android API level
        shell: bash
        run: |
          set -euo pipefail
          grep -RInE 'compileSdk(Version)?[ =]+36|compileSdk[[:space:]]+36' android
          grep -RInE 'targetSdk(Version)?[ =]+36|targetSdk[[:space:]]+36' android

      - name: Build debug-signed preview APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew app:assembleDebug --no-daemon --max-workers=2)
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Inspect package, signature and 16-KB zip alignment
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$AAPT" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -F "package: name='com.nexarenew.aiconsole'" apk-badging.txt
          grep -F "versionName='1.5.4'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee apk-signature.txt
          "$ZIPALIGN" -P 16 -c -v 4 "$APK_NAME" | tee apk-zipalign-16k.txt
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          ls -lh "$APK_NAME"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-stones-command-centre-v1.5.4-precision-complete-preview-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
            apk-badging.txt
            apk-signature.txt
            apk-zipalign-16k.txt
          if-no-files-found: error
          retention-days: 14
