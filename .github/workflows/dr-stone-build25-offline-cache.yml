name: Dr Stone Build 25 offline dependency cache

on:
  push:
    branches:
      - dr-stone-command-build25-public-ci-02092026170000
    paths:
      - .github/workflows/dr-stone-build25-offline-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-offline-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up exact Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|platform-tools'

      - name: Create exact dependency seed project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf seed-project
          mkdir -p seed-project/app/src/main seed-project/app/src/test/java/com/nexarenew/cache
          cat > seed-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > seed-project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DrStoneBuild25CacheSeed"
          include(":app")
          EOF
          cat > seed-project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.21" apply false
          }
          EOF
          cat > seed-project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.nexarenew.cache"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.nexarenew.cache"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.12.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("androidx.test:core-ktx:1.6.1")
              androidTestImplementation("androidx.test:runner:1.6.2")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1")
              implementation("androidx.navigation:navigation-compose:2.9.0")
              implementation("androidx.work:work-runtime-ktx:2.10.1")
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.tom-roush:pdfbox-android:2.0.27.0")
              testImplementation("junit:junit:4.13.2")
          }
          EOF
          cat > seed-project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Cache Seed" android:allowBackup="false" />
          </manifest>
          EOF
          cat > seed-project/app/src/test/java/com/nexarenew/cache/CacheSeedTest.kt <<'EOF'
          package com.nexarenew.cache
          import org.junit.Assert.assertTrue
          import org.junit.Test
          class CacheSeedTest { @Test fun seed() { assertTrue(true) } }
          EOF

      - name: Resolve exact Build 25 dependency graph and task toolchains
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cd seed-project
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          ./gradlew --no-daemon --max-workers=2 --stacktrace testDebugUnitTest lintDebug assembleDebug
          ./gradlew --no-daemon --max-workers=2 dependencies >/tmp/build25-dependencies.txt
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Stage Kotlin 2.1.21 CLI and offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          rm -rf build25-offline-toolchain
          mkdir -p build25-offline-toolchain/gradle-home build25-offline-toolchain/android-sdk build25-offline-toolchain/kotlin
          cp -a "$HOME/.gradle/caches" build25-offline-toolchain/gradle-home/
          cp -a "$HOME/.gradle/wrapper" build25-offline-toolchain/gradle-home/
          cp -a "$ANDROID_HOME/platforms/android-36" build25-offline-toolchain/android-sdk/
          mkdir -p build25-offline-toolchain/android-sdk/build-tools
          cp -a "$ANDROID_HOME/build-tools/36.0.0" build25-offline-toolchain/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools" build25-offline-toolchain/android-sdk/
          cp -a "$ANDROID_HOME/licenses" build25-offline-toolchain/android-sdk/ || true
          curl -fsSL --retry 3 --retry-delay 2 "https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip" -o /tmp/kotlin-compiler-2.1.21.zip
          unzip -q /tmp/kotlin-compiler-2.1.21.zip -d build25-offline-toolchain/kotlin
          cp /tmp/build25-dependencies.txt build25-offline-toolchain/
          cat > build25-offline-toolchain/TOOLCHAIN_IDENTITY.txt <<EOF
          Gradle=8.11.1
          AGP=8.10.1
          Kotlin=2.1.21
          compileSdk=36
          buildTools=36.0.0
          Java=21
          EOF
          tar -czf build25-offline-toolchain.tar.gz build25-offline-toolchain
          sha256sum build25-offline-toolchain.tar.gz > build25-offline-toolchain.tar.gz.sha256
          ls -lh build25-offline-toolchain.tar.gz
          cat build25-offline-toolchain.tar.gz.sha256

      - name: Upload offline toolchain cache
        uses: actions/upload-artifact@v4
        with:
          name: dr-stone-build25-offline-toolchain
          path: |
            build25-offline-toolchain.tar.gz
            build25-offline-toolchain.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
