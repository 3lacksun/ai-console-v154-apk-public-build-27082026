name: Dr Stone Build 25 split offline toolchain artifact

on:
  push:
    branches:
      - dr-stone-command-build25-public-ci-02092026170000
    paths:
      - .github/workflows/dr-stone-build25-toolchain-split.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download successful Build 25 toolchain artifact from run 33679564619
        uses: actions/download-artifact@v4
        with:
          name: dr-stone-build25-offline-toolchain
          path: source-artifact
          github-token: ${{ github.token }}
          repository: 3lacksun/ai-console-v154-apk-public-build-27082026
          run-id: 33679564619

      - name: Verify and split toolchain into connector-safe parts
        shell: bash
        run: |
          set -euo pipefail
          cd source-artifact
          test -s build25-offline-toolchain.tar.gz
          test -s build25-offline-toolchain.tar.gz.sha256
          sha256sum -c build25-offline-toolchain.tar.gz.sha256
          mkdir -p ../split-parts
          split -b 340M -d -a 2 build25-offline-toolchain.tar.gz ../split-parts/build25-offline-toolchain.tar.gz.part-
          cd ../split-parts
          test -s build25-offline-toolchain.tar.gz.part-00
          test -s build25-offline-toolchain.tar.gz.part-01
          test -s build25-offline-toolchain.tar.gz.part-02
          test ! -e build25-offline-toolchain.tar.gz.part-03
          cp ../source-artifact/build25-offline-toolchain.tar.gz.sha256 .
          sha256sum build25-offline-toolchain.tar.gz.part-* > split-parts.sha256
          wc -c build25-offline-toolchain.tar.gz.part-* | tee split-parts-sizes.txt
          cat split-parts.sha256

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: dr-stone-build25-toolchain-part-00
          path: |
            split-parts/build25-offline-toolchain.tar.gz.part-00
            split-parts/build25-offline-toolchain.tar.gz.sha256
            split-parts/split-parts.sha256
            split-parts/split-parts-sizes.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: dr-stone-build25-toolchain-part-01
          path: split-parts/build25-offline-toolchain.tar.gz.part-01
          if-no-files-found: error
          retention-days: 3

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: dr-stone-build25-toolchain-part-02
          path: split-parts/build25-offline-toolchain.tar.gz.part-02
          if-no-files-found: error
          retention-days: 3
