name: v1.5.4 Dependency Convergence

on:
  push:
    branches:
      - v154-runner-isolation-02092026

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Repository checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v154-runner-isolation-02092026
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate exact Expo-compatible dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund \
            expo@~57.0.19 \
            expo-asset@~57.0.16 \
            expo-build-properties@~57.0.16 \
            expo-constants@~57.0.17 \
            expo-image-picker@~57.0.15 \
            expo-secure-store@~57.0.3 \
            expo-sharing@~57.0.17
          npx expo install --check
          git diff --check

      - name: Commit converged manifests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency manifests already converged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Fix: converge Expo SDK 57 patch dependencies'
          git push origin HEAD:v154-runner-isolation-02092026
