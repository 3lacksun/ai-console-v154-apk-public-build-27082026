name: Code Dump v1.2.1 E2E Evidence Build v2

on:
  push:
    branches: [ codedump-e2e-evidence-1.2.1-07092026 ]
    paths:
      - 'codedump/e2e-evidence-fix/apply-e2e-evidence-fix.cjs'
      - 'codedump/e2e-evidence-fix/regression-e2e-spine.cjs'
      - 'codedump/package.json'
      - 'codedump/android-release.json'
      - '.github/workflows/codedump-e2e-evidence-1.2.1-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codedump-e2e-evidence-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    name: Verify E2E evidence allocation and build Android artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialise Code Dump 1.2.0 verified baseline
        shell: bash
        run: |
          set -euo pipefail
          cd codedump
          cat overlay-chunks/overlay.{00..13} overlay-chunks/overlay.14a overlay-chunks/overlay.14b overlay-chunks/overlay.14c overlay-chunks/overlay.{15..17} > /tmp/base.b64
          test "$(wc -c < /tmp/base.b64)" -eq 104336
          test "$(sha256sum /tmp/base.b64 | awk '{print $1}')" = "06d888899f0a3f67ca4254aef7fc81af9d9c9eeaf90205791fdb204c87082a67"
          base64 --decode /tmp/base.b64 > /tmp/base.tar.gz
          test "$(sha256sum /tmp/base.tar.gz | awk '{print $1}')" = "b3028e80b7cac2308c105337c020d3a66ecde12e3dfa094ca6f6bdbe18d7e87f"
          tar -xzf /tmp/base.tar.gz

          mkdir -p audit-upgrade
          cat audit-upgrade-payload/upgrade.tar.gz.b64.* | tr -d '\n' | base64 --decode > /tmp/audit.tar.gz
          test "$(sha256sum /tmp/audit.tar.gz | awk '{print $1}')" = "c1ff012daad44eb4e44bcf912d1765a5176a17d97ba90e97b16df1966456bd82"
          tar -xzf /tmp/audit.tar.gz -C audit-upgrade
          (cd web && patch --batch -p0 < ../audit-upgrade/runtime.patch)
          cp audit-upgrade/audit-pack.js web/audit-pack.js
          test "$(sha256sum web/audit-pack.js | awk '{print $1}')" = "70ce915752840b80a185b90ff8236d51e64d4a68797393cb462c52c519df9545"

          (cd web && patch --batch -p0 < ../audit-hotfix/audit-pack-1.0.1.patch)
          (cd audit-upgrade && patch --batch -p0 < ../audit-hotfix/audit-pack-1.0.1-test.patch)
          test "$(sha256sum web/audit-pack.js | awk '{print $1}')" = "94f088a2755991fa55e641e9c2da843175488fd7ec5b91a296ebb44eef051fa8"

          cat multiaudit-upgrade/payload.b64.* > /tmp/multi.b64
          test "$(wc -c < /tmp/multi.b64)" -eq 32576
          base64 --decode /tmp/multi.b64 > /tmp/multi.tar.gz
          test "$(sha256sum /tmp/multi.tar.gz | awk '{print $1}')" = "7e97cb996e3684bbfb9207a493967979515dcbd08c8c3a79ae1fe4ac91c778b1"
          mkdir -p multiaudit-upgrade/materialised
          tar -xzf /tmp/multi.tar.gz -C multiaudit-upgrade/materialised
          test "$(sha256sum multiaudit-upgrade/materialised/multiaudit-web.patch | awk '{print $1}')" = "900eaa28bc5378789111bc7481c3d364740fe0caf662d9ade27a997a26970862"
          patch --batch -p1 < multiaudit-upgrade/materialised/multiaudit-web.patch
          cp multiaudit-upgrade/materialised/audit-pack.test.cjs audit-upgrade/audit-pack.test.cjs
          test "$(sha256sum web/audit-pack.js | awk '{print $1}')" = "eddc76c880366a410002ead0487674568af9d26624ef7d56da7b23118d3b3334"
          test "$(sha256sum web/core.js | awk '{print $1}')" = "a0b0f2adf168bc71d3bc9f73c02bd2e153ee98e8d9abf3ac3a03d29b554ec6ad"

      - name: Apply and verify E2E evidence parser 1.1.1
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum e2e-evidence-fix/apply-e2e-evidence-fix.cjs | awk '{print $1}')" = "520bce6aff994443852066edd189c1cac94b431367f36ceaace66e8b05353259"
          test "$(sha256sum e2e-evidence-fix/regression-e2e-spine.cjs | awk '{print $1}')" = "4f2b396e6fa8ef5b410c276f746a963cfe3e8fe29ab51fa5e91d27cab5ef464e"
          node e2e-evidence-fix/apply-e2e-evidence-fix.cjs web/audit-pack.js
          node --check web/audit-pack.js
          test "$(sha256sum web/audit-pack.js | awk '{print $1}')" = "a9cdaf6bc17baadf1d84f3fcc3045f74ab11f8941bd01d7f93984adfef1700ef"
          grep -q "GENERATOR_VERSION = '1.1.1'" web/audit-pack.js
          grep -q 'critical workflow-spine source' web/audit-pack.js
          grep -q 'Critical-spine records missing' web/audit-pack.js

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run legacy and 501-file regression suites
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          node --check web/core.js
          node --check web/app.js
          node --check web/audit-pack.js
          node audit-upgrade/audit-pack.test.cjs
          node e2e-evidence-fix/regression-e2e-spine.cjs web/audit-pack.js

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          cd codedump
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save jszip@3.10.1
          mkdir -p web/vendor
          cp node_modules/jszip/dist/jszip.min.js web/vendor/jszip.min.js

      - name: Prepare Android project
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android.mjs
          grep -q "versionCode 4" android/app/build.gradle
          grep -q 'versionName "1.2.1"' android/app/build.gradle
          grep -q "GENERATOR_VERSION = '1.1.1'" android/app/src/main/assets/public/audit-pack.js
          test "$(sha256sum android/app/src/main/assets/public/audit-pack.js | awk '{print $1}')" = "a9cdaf6bc17baadf1d84f3fcc3045f74ab11f8941bd01d7f93984adfef1700ef"

      - name: Run unit tests lint and Android builds
        working-directory: codedump/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease

      - name: Stage artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp codedump/android/app/build/outputs/apk/debug/app-debug.apk artifacts/
          find codedump/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} artifacts/ \;
          find codedump/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} artifacts/ \;
          {
            echo "Carrier repository: $GITHUB_REPOSITORY"
            echo "Carrier commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Code Dump version: 1.2.1"
            echo "Application ID: app.codedump.tool"
            echo "Audit Pack Generator: 1.1.1"
            echo "E2E evidence allocator: critical-spine plus breadth-before-depth"
            echo "Transformer SHA-256: 520bce6aff994443852066edd189c1cac94b431367f36ceaace66e8b05353259"
            echo "501-file regression SHA-256: 4f2b396e6fa8ef5b410c276f746a963cfe3e8fe29ab51fa5e91d27cab5ef464e"
            echo "Audit engine SHA-256: a9cdaf6bc17baadf1d84f3fcc3045f74ab11f8941bd01d7f93984adfef1700ef"
            echo "Capacitor: 8.5.0"
            echo "AGP: 8.13.2"
            echo "Kotlin: 2.3.20"
            echo "Java: 21"
            echo "Android: API 36 / Build Tools 36.0.0"
          } > artifacts/BUILD_INFO.txt
          (cd artifacts && sha256sum *.apk *.aab BUILD_INFO.txt 2>/dev/null | sort > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload verified Code Dump 1.2.1 artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-dump-v1.2.1-e2e-evidence-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
