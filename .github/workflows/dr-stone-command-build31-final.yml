name: Dr Stone Command Build31 Final Android Gate

on:
  push:
    branches:
      - dr-stone-command-build31-ci-final
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA256: 4d7d98b1b5c93dc8b247ce318f536580367736831eae76de1be626109a31d9bd
  BUILD_TOOLS: 36.0.0
  ANDROID_API: 36
  EVIDENCE_DIR: build31-final-evidence

jobs:
  build31-final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated Build31 CI branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Reconstruct and integrity-lock Build31 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat ci/dr-stone-build31/source.part*.bin > build31_compile_min.zip
          stat -c 'SOURCE_BYTES=%s' build31_compile_min.zip | tee "$EVIDENCE_DIR/source-size.txt"
          sha256sum build31_compile_min.zip | tee "$EVIDENCE_DIR/source-sha256-observed.txt"
          echo "$SOURCE_SHA256  build31_compile_min.zip" | sha256sum -c - | tee "$EVIDENCE_DIR/source-sha256-verdict.txt"
          unzip -t build31_compile_min.zip | tee "$EVIDENCE_DIR/source-zip-integrity.txt"
          rm -rf build31
          mkdir build31
          unzip -q build31_compile_min.zip -d build31
          chmod +x build31/gradlew
          grep -F 'applicationId = "com.nexarenew.drstonecommand"' build31/app/build.gradle.kts | tee "$EVIDENCE_DIR/source-identity.txt"
          grep -F 'versionCode = 31' build31/app/build.gradle.kts | tee -a "$EVIDENCE_DIR/source-identity.txt"
          grep -F 'versionName = "0.3.0"' build31/app/build.gradle.kts | tee -a "$EVIDENCE_DIR/source-identity.txt"
          grep -F 'compileSdk = 36' build31/app/build.gradle.kts | tee -a "$EVIDENCE_DIR/source-identity.txt"
          grep -F 'targetSdk = 36' build31/app/build.gradle.kts | tee -a "$EVIDENCE_DIR/source-identity.txt"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android API 36 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"
          sdkmanager --list_installed | tee "$EVIDENCE_DIR/android-sdk-installed.txt"

      - name: Android unit tests and Kotlin compile
        shell: bash
        working-directory: build31
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest :app:compileDebugKotlin --stacktrace 2>&1 | tee "../$EVIDENCE_DIR/gradle-test-compile.txt"

      - name: Android lint
        shell: bash
        working-directory: build31
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 lintDebug --stacktrace 2>&1 | tee "../$EVIDENCE_DIR/gradle-lint.txt"

      - name: Clean assemble debug APK
        shell: bash
        working-directory: build31
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 clean assembleDebug --stacktrace 2>&1 | tee "../$EVIDENCE_DIR/gradle-assemble.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../DR_STONE_COMMAND_V0_3_0_BUILD31_DEBUG.apk

      - name: APK forensic gate
        shell: bash
        run: |
          set -euo pipefail
          APK=DR_STONE_COMMAND_V0_3_0_BUILD31_DEBUG.apk
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$BT/aapt" dump badging "$APK" | tee "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='31' versionName='0.3.0'" "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "sdkVersion:'26'" "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "targetSdkVersion:'36'" "$EVIDENCE_DIR/apk-badging.txt"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tee "$EVIDENCE_DIR/zipalign.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$EVIDENCE_DIR/apksigner.txt"
          sha256sum "$APK" | tee "$EVIDENCE_DIR/apk-sha256.txt"
          stat -c 'APK_BYTES=%s' "$APK" | tee "$EVIDENCE_DIR/apk-size.txt"

      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DR_STONE_COMMAND_V0_3_0_BUILD31_FINAL_CI
          retention-days: 30
          if-no-files-found: warn
          path: |
            DR_STONE_COMMAND_V0_3_0_BUILD31_DEBUG.apk
            build31-final-evidence/
