name: Precision v1.5.4 Runtime Acceptance Action

on:
  push:
    branches:
      - precision-authoritative-apk-02092026
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: precision-v154-runtime-action
  cancel-in-progress: true

env:
  APK_SHA256: 474fa005fbb3f5c320aa3a129fc2cf26500ef4da6d000143d7cd75aec1183258
  PKG: com.nexarenew.aiconsole
  APK: runtime-apk/DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG.apk

jobs:
  android16:
    name: Android 16 API 36 action cold launch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Linux KVM for Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Download exact verified APK
        uses: actions/download-artifact@v4
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG
          path: runtime-apk
          github-token: ${{ github.token }}
          repository: 3lacksun/ai-console-v154-apk-public-build-27082026
          run-id: 33681949327
      - name: Pin Android 16 APK SHA and prepare runtime script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/android16
          echo "$APK_SHA256  $APK" | sha256sum -c - | tee runtime-evidence/android16/apk-sha.txt
          cat > /tmp/android16-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          E=runtime-evidence/android16
          mkdir -p "$E"
          adb devices -l | tee "$E/adb-devices.txt"
          adb shell getprop ro.build.version.release | tee "$E/android-release.txt"
          adb shell getprop ro.build.version.sdk | tee "$E/android-sdk.txt"
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '36'
          adb install -r "$APK" | tee "$E/install.txt"
          grep -q '^Success' "$E/install.txt"
          A="$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -1)"
          echo "ACTIVITY=$A" | tee "$E/activity.txt"
          test -n "$A"
          adb shell am force-stop "$PKG"
          adb logcat -c
          adb shell am start -W -n "$A" | tee "$E/am-start.txt"
          sleep 20
          P="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
          echo "PID=$P" | tee "$E/pid.txt"
          test -n "$P"
          adb shell dumpsys activity activities > "$E/activities.txt"
          grep -F "$PKG" "$E/activities.txt" | head -40
          adb logcat -d -v threadtime > "$E/logcat.txt" || true
          if grep -E "FATAL EXCEPTION|Process: ${PKG}([,[:space:]]|$)" "$E/logcat.txt"; then
            echo 'Android runtime fatal exception detected' >&2
            exit 30
          fi
          echo 'ANDROID_16_COLD_LAUNCH=PASS' | tee "$E/result.txt"
          EOF
          chmod +x /tmp/android16-runtime.sh
      - name: Android 16 API 36 cold launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash /tmp/android16-runtime.sh
      - name: Capture Android 16 final diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-evidence/android16
          timeout 5 adb devices -l > runtime-evidence/android16/adb-devices-final.txt 2>&1 || true
          timeout 10 adb logcat -d -v threadtime > runtime-evidence/android16/logcat-final.txt 2>&1 || true
      - name: Upload Android 16 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_ANDROID16_ACTION_EVIDENCE
          path: runtime-evidence/android16
          if-no-files-found: warn
          retention-days: 14

  page16k:
    name: Android 15 API 35 16 KB action cold launch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Linux KVM for Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Download exact verified APK
        uses: actions/download-artifact@v4
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_PRECISION_PREVIEW_DEBUG
          path: runtime-apk
          github-token: ${{ github.token }}
          repository: 3lacksun/ai-console-v154-apk-public-build-27082026
          run-id: 33681949327
      - name: Pin 16 KB APK SHA and prepare runtime script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/page16k
          echo "$APK_SHA256  $APK" | sha256sum -c - | tee runtime-evidence/page16k/apk-sha.txt
          cat > /tmp/page16k-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          E=runtime-evidence/page16k
          mkdir -p "$E"
          adb devices -l | tee "$E/adb-devices.txt"
          PAGE="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
          echo "PAGE_SIZE=$PAGE" | tee "$E/page-size.txt"
          test "$PAGE" = '16384'
          adb shell getprop ro.build.version.release | tee "$E/android-release.txt"
          adb shell getprop ro.build.version.sdk | tee "$E/android-sdk.txt"
          adb install -r "$APK" | tee "$E/install.txt"
          grep -q '^Success' "$E/install.txt"
          A="$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -1)"
          echo "ACTIVITY=$A" | tee "$E/activity.txt"
          test -n "$A"
          adb shell am force-stop "$PKG"
          adb logcat -c
          adb shell am start -W -n "$A" | tee "$E/am-start.txt"
          sleep 20
          P="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
          echo "PID=$P" | tee "$E/pid.txt"
          test -n "$P"
          adb shell dumpsys activity activities > "$E/activities.txt"
          grep -F "$PKG" "$E/activities.txt" | head -40
          adb logcat -d -v threadtime > "$E/logcat.txt" || true
          if grep -E "FATAL EXCEPTION|Process: ${PKG}([,[:space:]]|$)" "$E/logcat.txt"; then
            echo '16 KB runtime fatal exception detected' >&2
            exit 50
          fi
          echo 'ANDROID_16KB_COLD_LAUNCH=PASS' | tee "$E/result.txt"
          EOF
          chmod +x /tmp/page16k-runtime.sh
      - name: Android API 35 dedicated 16 KB cold launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash /tmp/page16k-runtime.sh
      - name: Capture 16 KB final diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-evidence/page16k
          timeout 5 adb devices -l > runtime-evidence/page16k/adb-devices-final.txt 2>&1 || true
          timeout 10 adb logcat -d -v threadtime > runtime-evidence/page16k/logcat-final.txt 2>&1 || true
      - name: Upload 16 KB evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_16KB_ACTION_EVIDENCE
          path: runtime-evidence/page16k
          if-no-files-found: warn
          retention-days: 14
