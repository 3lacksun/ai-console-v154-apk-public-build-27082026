name: RepFlow Watch V1 APKBUILD V10

on:
  push:
    branches: [repflow-watch-v1-apkbuild-v10-16092026]

permissions:
  contents: read

env:
  BUILD_READY_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-35c0-81f4-b790-8dd6f411afa2/raw?se=2026-09-16T01%3A09%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=70c807b9-28b1-597a-9b61-93685b8e91e3&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T18%3A11%3A22Z&ske=2026-09-16T18%3A11%3A22Z&sks=b&skv=2026-02-06&sig=oRgJfdHDkTHIKE8nwptYIt82fI01XPHmGNHL/yvgUbU%3D"
  BUILD_READY_SHA256: 3679fb7b7c691019d3b79fb929ba6f355f32fff5dab41f27e368c08e7fa9ed68
  BUILD_READY_SIZE: '1412395'
  NESTED_SOURCE_SHA256: 990e6d1e06b6af471d737171c5c483135b1c492316cde09f45c0a961564cd17c
  NESTED_SOURCE_SIZE: '1388368'
  GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
  GRADLE_SIZE: '137393837'
  GRADLE_USER_HOME: ${{ github.workspace }}/.repflow-gradle-home

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Recover and verify complete source lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source repflow-work /tmp/build-ready
          curl -fL --retry 3 --retry-delay 1 "$BUILD_READY_URL" -o /tmp/build-ready.zip
          test "$(stat -c '%s' /tmp/build-ready.zip)" = "$BUILD_READY_SIZE"
          echo "$BUILD_READY_SHA256  /tmp/build-ready.zip" | sha256sum -c -
          unzip -tq /tmp/build-ready.zip >/dev/null
          unzip -q /tmp/build-ready.zip -d /tmp/build-ready
          NESTED=$(find /tmp/build-ready -type f -name 'repflow-watch-v1-build-source.tar.gz' -print -quit)
          test -n "$NESTED"
          test "$(stat -c '%s' "$NESTED")" = "$NESTED_SOURCE_SIZE"
          echo "$NESTED_SOURCE_SHA256  $NESTED" | sha256sum -c -
          tar -tzf "$NESTED" >/dev/null
          tar -xzf "$NESTED" -C repflow-work
          test -f repflow-work/android/app/build.gradle
          test -f repflow-work/android/wear/build.gradle
          test -f repflow-work/native/android/RepFlowWearPlugin.java
          test -f repflow-work/native/wear/src/main/java/net/nexarenew/repflow/wear/health/RepFlowHealthServices.kt
          printf '%s  %s\n%s  %s\n' "$BUILD_READY_SHA256" /tmp/build-ready.zip "$NESTED_SOURCE_SHA256" "$NESTED" | tee evidence/source/SOURCE_LINEAGE_SHA256.txt
          cat > /tmp/native-template-sha.txt <<'EOF'
          619e8c3d5e565e2d389dd4d470f26f12b321040d39882884fa78b793ff70af72  native/android/RepFlowSecureStorePlugin.java
          1e13b0c234ad66ab95a92486b9f89bbb4da3a5246c7a1bcf2e814d1e0ad3f989  native/android/RepFlowAIHttpPlugin.java
          a69db0f0dc7e068c0f024c4ec888b81666e3b6c03f7afcc6607f44555610a684  native/android/RepFlowSystemPlugin.java
          8f277ab7a71f2dcfb3beff28fc9201e2502eb53321d52d11b6a17ef82fa52575  native/android/RepFlowWearContract.java
          e4f3699e6c6be08468f443f84afb79371fa3d6a15d812bf04686f454f8b8bd56  native/android/RepFlowWearStore.java
          8cb918138bcfe30f340388eaccf4668b57a5b20041639a73c1895bac7e1a1865  native/android/RepFlowWearListenerService.java
          2ee7cb2da7a41d6ecdb87b387fab73c894521db1e45b3b52933bac5725218deb  native/android/RepFlowWearPlugin.java
          25d26095a61267b264e4b42f8737cbb57d1d6c3139a05f223eda030b31ab3559  native/android/MainActivity.java
          EOF
          (cd repflow-work && sha256sum -c /tmp/native-template-sha.txt) | tee evidence/source/NATIVE_TEMPLATE_HASHES.txt

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with: {packages: '', accept-android-sdk-licenses: true}

      - name: Verify exact Android and Gradle toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/toolchain
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          java -version 2>&1 | tee evidence/toolchain/JAVA_VERSION.txt
          node --version | tee evidence/toolchain/NODE_VERSION.txt
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          for t in aapt aapt2 zipalign apksigner; do test -x "$ANDROID_HOME/build-tools/36.0.0/$t"; done
          Z="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          curl -fL --retry 4 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$Z"
          test "$(stat -c '%s' "$Z")" = "$GRADLE_SIZE"
          echo "$GRADLE_SHA256  $Z" | sha256sum -c -
          unzip -tq "$Z" >/dev/null
          unzip -q "$Z" -d "$RUNNER_TEMP/gradle"
          G="$RUNNER_TEMP/gradle/gradle-8.14.3/bin/gradle"
          "$G" --version | tee evidence/toolchain/GRADLE_VERSION.txt
          grep -q '^Gradle 8.14.3$' evidence/toolchain/GRADLE_VERSION.txt
          echo "GRADLE_BIN=$G" >> "$GITHUB_ENV"
          sdkmanager --list_installed | tee evidence/toolchain/ANDROID_SDK.txt

      - name: Install exact Capacitor dependency tree
        working-directory: repflow-work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/npm
          npm ci --include=dev --no-audit --no-fund 2>&1 | tee ../evidence/npm/NPM_CI.txt
          test ${PIPESTATUS[0]} -eq 0
          test "$(node -p "require('./node_modules/@capacitor/android/package.json').version")" = '8.5.0'
          test "$(node -p "require('./node_modules/@capacitor/core/package.json').version")" = '8.5.0'
          printf 'capacitor_android=%s\ncapacitor_core=%s\n' "$(node -p "require('./node_modules/@capacitor/android/package.json').version")" "$(node -p "require('./node_modules/@capacitor/core/package.json').version")" | tee ../evidence/npm/CAPACITOR_VERSIONS.txt

      - name: Apply locked successor and Health Services remediation
        working-directory: repflow-work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/remediation
          python3 - <<'PY' | tee ../evidence/remediation/LOCKED_REMEDIATION.txt
          from pathlib import Path
          import shutil
          dep='org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
          gradles=[Path('native/wear/build.gradle'),Path('android/wear/build.gradle')]
          entities=[Path('native/wear/src/main/java/net/nexarenew/repflow/wear/data/Entities.kt'),Path('android/wear/src/main/java/net/nexarenew/repflow/wear/data/Entities.kt')]
          dbs=[Path('native/wear/src/main/java/net/nexarenew/repflow/wear/data/RepFlowWatchDatabase.kt'),Path('android/wear/src/main/java/net/nexarenew/repflow/wear/data/RepFlowWatchDatabase.kt')]
          health=[Path('native/wear/src/main/java/net/nexarenew/repflow/wear/health/RepFlowHealthServices.kt'),Path('android/wear/src/main/java/net/nexarenew/repflow/wear/health/RepFlowHealthServices.kt')]
          for p in gradles:
              s=p.read_text()
              if dep not in s:
                  anchor="implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'"
                  if anchor not in s: raise SystemExit('coroutine anchor missing '+str(p))
                  s=s.replace(anchor,anchor+"\n    implementation '"+dep+"'")
                  p.write_text(s)
          composite='Index(value = ["sessionId", "exerciseId", "setNumber"], unique = true)'
          for p in entities:
              s=p.read_text(); s=s.replace('Index("sessionId"),\n        '+composite,'Index("sessionId")')
              if composite in s: raise SystemExit('unsafe entity unique index remains '+str(p))
              p.write_text(s)
          needle='index_set_record_sessionId_exerciseId_setNumber'
          for p in dbs:
              lines=p.read_text().splitlines()
              lines=[x for x in lines if not (needle in x and 'CREATE UNIQUE INDEX' in x.upper())]
              p.write_text('\n'.join(lines)+'\n')
              if any(needle in x and 'CREATE UNIQUE INDEX' in x.upper() for x in lines): raise SystemExit('unsafe migration remains '+str(p))
          for p in health:
              s=p.read_text()
              s=s.replace('import androidx.health.services.client.HealthServices\n','import androidx.health.services.client.HealthServices\nimport androidx.health.services.client.clearUpdateCallback\nimport androidx.health.services.client.endExercise\nimport androidx.health.services.client.getCapabilities\nimport androidx.health.services.client.startExercise\n')
              for old in ['import com.google.common.util.concurrent.ListenableFuture\n','import kotlin.coroutines.resume\n','import kotlin.coroutines.resumeWithException\n','import kotlinx.coroutines.suspendCancellableCoroutine\n']:
                  s=s.replace(old,'')
              s=s.replace('DataType.TOTAL_CALORIES','DataType.CALORIES_TOTAL')
              s=s.replace('exerciseClient.getCapabilitiesAsync().awaitDirect()','exerciseClient.getCapabilities()')
              s=s.replace('exerciseClient.startExerciseAsync(\n            ExerciseConfig(','exerciseClient.startExercise(\n            ExerciseConfig(')
              s=s.replace('        ).awaitDirect()\n        activeSessionId.set(sessionId)','        )\n        activeSessionId.set(sessionId)')
              s=s.replace('exerciseClient.endExerciseAsync().awaitDirect()','exerciseClient.endExercise()')
              s=s.replace('exerciseClient.clearUpdateCallbackAsync(callback).awaitDirect()','exerciseClient.clearUpdateCallback(callback)')
              s=s.replace('update.latestMetrics.getData(DataType.CALORIES_TOTAL).lastOrNull()?.total','update.latestMetrics.getData(DataType.CALORIES_TOTAL)?.total')
              marker='        override fun onAvailabilityChanged(dataType: DataType<*, *>, availability: Availability) = Unit\n'
              if 'override fun onRegistered()' not in s:
                  if marker not in s: raise SystemExit('callback marker missing '+str(p))
                  s=s.replace(marker,marker+'\n        override fun onRegistered() = Unit\n\n        override fun onRegistrationFailed(throwable: Throwable) = Unit\n')
              cut='\nprivate suspend fun <T> ListenableFuture<T>.awaitDirect()'
              if cut in s: s=s.split(cut,1)[0].rstrip()+'\n'
              forbidden=['DataType.TOTAL_CALORIES','ListenableFuture','awaitDirect','com.google.common.util.concurrent','getData(DataType.CALORIES_TOTAL).lastOrNull()']
              if any(x in s for x in forbidden): raise SystemExit('stale Health Services API remains '+str(p))
              required=['DataType.CALORIES_TOTAL','update.latestMetrics.getData(DataType.CALORIES_TOTAL)?.total','override fun onRegistered()','override fun onRegistrationFailed(throwable: Throwable)','exerciseClient.getCapabilities()','exerciseClient.startExercise(','exerciseClient.endExercise()','exerciseClient.clearUpdateCallback(callback)']
              for x in required:
                  if x not in s: raise SystemExit('missing Health Services correction '+x+' '+str(p))
              p.write_text(s)
          if health[0].read_text()!=health[1].read_text(): raise SystemExit('native/generated Health Services copies diverged')
          for d in [Path('native/wear/schemas'),Path('android/wear/schemas')]:
              if d.exists(): shutil.rmtree(d)
              d.mkdir(parents=True,exist_ok=True)
          print('LOCKED_REMEDIATION=PASS')
          print('HEALTH_SERVICES_API_REMEDIATION=PASS')
          print('AGGREGATE_CALORIES_ACCESSOR=PASS')
          PY

      - name: Execute retained Watch acceptance and migration regression
        working-directory: repflow-work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/acceptance
          node verification/repflow_watch_contract_acceptance.js 2>&1 | tee ../evidence/acceptance/WATCH_PHASE1_CONTRACT_ACCEPTANCE.txt
          test ${PIPESTATUS[0]} -eq 0
          grep -q 'REPFLOW_WATCH_PHASE1_CONTRACT_ACCEPTANCE: PASS (40 assertions)' ../evidence/acceptance/WATCH_PHASE1_CONTRACT_ACCEPTANCE.txt
          node verification/repflow_watch_phase2_bridge_acceptance.js 2>&1 | tee ../evidence/acceptance/WATCH_PHASE2_BRIDGE_ACCEPTANCE.txt
          test ${PIPESTATUS[0]} -eq 0
          grep -q 'REPFLOW_WATCH_PHASE2_BRIDGE_ACCEPTANCE: PASS (34 assertions)' ../evidence/acceptance/WATCH_PHASE2_BRIDGE_ACCEPTANCE.txt
          python3 - <<'PY' | tee ../evidence/acceptance/SUCCESSOR_MIGRATION_ACCEPTANCE.txt
          from pathlib import Path
          import sqlite3,re,ast
          def t(p): return Path(p).read_text()
          ok=[]
          def ck(n,v): assert v,n; ok.append(n); print('PASS',n)
          hs=t('android/wear/src/main/java/net/nexarenew/repflow/wear/health/RepFlowHealthServices.kt')
          ck('health_services_correct_api','DataType.CALORIES_TOTAL' in hs and 'ListenableFuture' not in hs and 'awaitDirect' not in hs)
          ck('aggregate_calories_accessor','update.latestMetrics.getData(DataType.CALORIES_TOTAL)?.total' in hs and 'getData(DataType.CALORIES_TOTAL).lastOrNull()' not in hs)
          ck('health_callback_contract','onRegistered()' in hs and 'onRegistrationFailed(throwable: Throwable)' in hs)
          ck('ongoing_activity_runtime','OngoingActivity' in t('native/wear/src/main/java/net/nexarenew/repflow/wear/service/RepFlowWorkoutService.kt'))
          ck('complete_set_control','completeSet' in t('native/wear/src/main/java/net/nexarenew/repflow/wear/ui/RepFlowWearScreen.kt'))
          ck('finish_workout_control','finishWorkout' in t('native/wear/src/main/java/net/nexarenew/repflow/wear/MainActivity.kt'))
          ck('substitution_persistence','substitutionsJson' in t('native/wear/src/main/java/net/nexarenew/repflow/wear/data/RepFlowWatchRepository.kt'))
          ck('data_layer_service','WearableListenerService' in t('native/wear/src/main/java/net/nexarenew/repflow/wear/sync/RepFlowDataLayerService.kt'))
          ck('phone_wear_bridge_registered','registerPlugin(RepFlowWearPlugin.class);' in t('native/android/MainActivity.java'))
          ck('identity',"applicationId 'net.nexarenew.repflow'" in t('android/wear/build.gradle') and 'versionCode 9' in t('android/wear/build.gradle') and "versionName '1.0.0-capacitor.9'" in t('android/wear/build.gradle'))
          ck('coroutine_bridge','kotlinx-coroutines-play-services:1.10.2' in t('android/wear/build.gradle'))
          ck('unsafe_entity_index_absent','Index(value = ["sessionId", "exerciseId", "setNumber"], unique = true)' not in t('android/wear/src/main/java/net/nexarenew/repflow/wear/data/Entities.kt'))
          db=t('android/wear/src/main/java/net/nexarenew/repflow/wear/data/RepFlowWatchDatabase.kt')
          ck('unsafe_migration_index_absent','CREATE UNIQUE INDEX IF NOT EXISTS index_set_record_sessionId_exerciseId_setNumber' not in db)
          body=db.split('override fun migrate(db: SupportSQLiteDatabase) {',1)[1].split('\n            }',1)[0]
          sql=[ast.literal_eval(m.group(1)) for m in re.finditer(r'db\.execSQL\(("(?:[^"\\]|\\.)*")\)',body)]
          ck('migration_sql_extracted',len(sql)>=20)
          con=sqlite3.connect(':memory:')
          con.execute('CREATE TABLE workout_session(id TEXT PRIMARY KEY NOT NULL,state TEXT NOT NULL)')
          con.execute('CREATE TABLE set_record(id TEXT PRIMARY KEY NOT NULL,sessionId TEXT NOT NULL)')
          con.execute('CREATE TABLE sync_event(id TEXT PRIMARY KEY NOT NULL)')
          con.execute('CREATE TABLE sync_state(id INTEGER PRIMARY KEY NOT NULL)')
          con.execute('CREATE TABLE timer_state(id INTEGER PRIMARY KEY NOT NULL,sessionId TEXT NOT NULL)')
          con.executemany('INSERT INTO set_record(id,sessionId) VALUES (?,?)',[('legacy-1','same-session'),('legacy-2','same-session'),('legacy-3','same-session')])
          for stmt in sql: con.execute(stmt)
          rows=con.execute('SELECT id,sessionId,exerciseId,setNumber FROM set_record ORDER BY id').fetchall()
          ck('legacy_collision_rows_survive',len(rows)==3 and all(r[1:]==('same-session','',0) for r in rows))
          ck('unsafe_index_not_created','index_set_record_sessionId_exerciseId_setNumber' not in [r[1] for r in con.execute("PRAGMA index_list('set_record')")])
          print(f'SUCCESSOR_MIGRATION_ACCEPTANCE: PASS ({len(ok)} assertions)')
          PY

      - name: Compile Wear Kotlin preflight
        working-directory: repflow-work/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../evidence/build/preflight
          "$GRADLE_BIN" --no-daemon --stacktrace :wear:compileDebugKotlin 2>&1 | tee ../../evidence/build/preflight/WEAR_COMPILE_DEBUG.txt
          test ${PIPESTATUS[0]} -eq 0
          echo WEAR_COMPILE_DEBUG=PASS | tee ../../evidence/build/preflight/WEAR_COMPILE_DEBUG_PROOF.txt

      - name: Online debug tests lint and assemble dependency warm
        working-directory: repflow-work/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../evidence/build/online
          "$GRADLE_BIN" --no-daemon --stacktrace :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug 2>&1 | tee ../../evidence/build/online/GRADLE_ONLINE.txt
          test ${PIPESTATUS[0]} -eq 0
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f wear/build/outputs/apk/debug/wear-debug.apk
          echo ONLINE_BUILD=PASS | tee ../../evidence/build/online/ONLINE_BUILD_PROOF.txt

      - name: Validate exported Room schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/room-schema
          python3 - <<'PY' | tee evidence/room-schema/ROOM_SCHEMA_VALIDATION.txt
          import json,pathlib
          files=sorted(pathlib.Path('repflow-work/android/wear/schemas').rglob('*.json'))
          assert files,'Room did not export schema JSON'
          for p in files:
              json.loads(p.read_text())
              assert 'index_set_record_sessionId_exerciseId_setNumber' not in p.read_text(),p
              print('JSON_PASS',p)
          print('ROOM_SCHEMA_VALIDATION=PASS')
          PY

      - name: Clean second build strictly offline
        working-directory: repflow-work/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../evidence/build/offline
          "$GRADLE_BIN" --offline --no-daemon clean 2>&1 | tee ../../evidence/build/offline/CLEAN_OFFLINE.txt
          test ${PIPESTATUS[0]} -eq 0
          "$GRADLE_BIN" --offline --no-daemon --stacktrace :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug 2>&1 | tee ../../evidence/build/offline/GRADLE_OFFLINE.txt
          test ${PIPESTATUS[0]} -eq 0
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f wear/build/outputs/apk/debug/wear-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk wear/build/outputs/apk/debug/wear-debug.apk | tee ../../evidence/build/offline/APK_SHA256.txt
          echo OFFLINE_BUILD=PASS | tee ../../evidence/build/offline/OFFLINE_BUILD_PROOF.txt

      - name: Verify offline APK bytes and package final handover
        shell: bash
        run: |
          set -euo pipefail
          P=repflow-work/android/app/build/outputs/apk/debug/app-debug.apk
          W=repflow-work/android/wear/build/outputs/apk/debug/wear-debug.apk
          B="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p final/APK final/VERIFICATION final/SOURCE final/TOOLCHAIN final/MANIFESTS
          cp "$P" final/APK/RepFlow-phone-debug.apk
          cp "$W" final/APK/RepFlow-wear-debug.apk
          unzip -tq "$P"; unzip -tq "$W"
          "$B/aapt2" dump badging "$P" | tee final/VERIFICATION/PHONE_BADGING.txt
          "$B/aapt2" dump badging "$W" | tee final/VERIFICATION/WEAR_BADGING.txt
          "$B/aapt2" dump permissions "$P" | tee final/VERIFICATION/PHONE_PERMISSIONS.txt
          "$B/aapt2" dump permissions "$W" | tee final/VERIFICATION/WEAR_PERMISSIONS.txt
          grep -q "package: name='net.nexarenew.repflow' versionCode='9' versionName='1.0.0-capacitor.9'" final/VERIFICATION/PHONE_BADGING.txt
          grep -q "package: name='net.nexarenew.repflow' versionCode='9' versionName='1.0.0-capacitor.9'" final/VERIFICATION/WEAR_BADGING.txt
          "$B/zipalign" -c -P 16 -v 4 "$P" > final/VERIFICATION/PHONE_ZIPALIGN.txt
          "$B/zipalign" -c -P 16 -v 4 "$W" > final/VERIFICATION/WEAR_ZIPALIGN.txt
          "$B/apksigner" verify --verbose --print-certs "$P" > final/VERIFICATION/PHONE_APKSIGNER.txt
          "$B/apksigner" verify --verbose --print-certs "$W" > final/VERIFICATION/WEAR_APKSIGNER.txt
          PC=$(grep -m1 'Signer #1 certificate SHA-256 digest:' final/VERIFICATION/PHONE_APKSIGNER.txt | awk '{print $NF}')
          WC=$(grep -m1 'Signer #1 certificate SHA-256 digest:' final/VERIFICATION/WEAR_APKSIGNER.txt | awk '{print $NF}')
          test -n "$PC" && test "$PC" = "$WC"
          echo "$PC" | tee final/VERIFICATION/SIGNER_CERT_SHA256.txt
          sha256sum final/APK/*.apk | tee final/VERIFICATION/APK_SHA256.txt
          stat -c '%n %s bytes' final/APK/*.apk | tee final/VERIFICATION/APK_SIZES.txt
          cp -a evidence/. final/VERIFICATION/
          cp evidence/toolchain/* final/TOOLCHAIN/
          rsync -a --exclude node_modules --exclude android/.gradle --exclude '*/build/' repflow-work/ final/SOURCE/
          cat > final/README_FIRST.md <<'EOF'
          # RepFlow Watch V1 final APK-bearing handover
          APK/ contains the phone and Wear debug APK bytes produced by the second Gradle build executed with --offline after dependency warming.
          EOF
          cat > final/FINAL_BUILD_STATUS.md <<EOF
          # Final build status
          Watch Phase 1 contract: PASS (40/40)
          Watch Phase 2 bridge: PASS (34/34)
          Successor migration collision regression: PASS
          Health Services 1.1.0-rc02 API remediation: PASS
          Aggregate calorie accessor: PASS
          Room exported schema parse: PASS
          Online debug tests/lint/assemble: PASS
          Clean second --offline debug tests/lint/assemble: PASS
          Phone APK verification: PASS
          Wear APK verification: PASS
          Package/version identity: PASS
          ZIP integrity/alignment/signatures: PASS
          Common signer: PASS
          Signer certificate SHA-256: $PC
          EOF
          find final -type f ! -path 'final/MANIFESTS/HANDOVER_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > final/MANIFESTS/HANDOVER_SHA256SUMS.txt
          PRE="$RUNNER_TEMP/preflight-handover.zip"
          zip -qr "$PRE" final
          unzip -tq "$PRE"
          rm -rf "$RUNNER_TEMP/clean-extract"; mkdir -p "$RUNNER_TEMP/clean-extract"
          unzip -q "$PRE" -d "$RUNNER_TEMP/clean-extract"
          (cd "$RUNNER_TEMP/clean-extract" && sha256sum -c final/MANIFESTS/HANDOVER_SHA256SUMS.txt) > final/VERIFICATION/CLEAN_EXTRACT_PROOF.txt
          echo CLEAN_EXTRACT_VERIFICATION=PASS >> final/VERIFICATION/CLEAN_EXTRACT_PROOF.txt
          find final -type f ! -path 'final/MANIFESTS/HANDOVER_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > final/MANIFESTS/HANDOVER_SHA256SUMS.txt
          TS=$(date -u +'%d%m%Y%H%M%S')
          ZIP="REPFLOW_WATCH_V1_APK_COMPLETE_HANDOVER_${TS}.zip"
          zip -qr "$ZIP" final
          unzip -t "$ZIP" | tee HANDOVER_ZIP_TEST.txt
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          echo "HANDOVER_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload verified APK-bearing handover
        uses: actions/upload-artifact@v4
        with:
          name: repflow-watch-v1-apk-complete-${{ github.run_id }}
          path: |
            ${{ env.HANDOVER_ZIP }}
            ${{ env.HANDOVER_ZIP }}.sha256
            HANDOVER_ZIP_TEST.txt
            final/APK/*.apk
            final/VERIFICATION/**
            final/FINAL_BUILD_STATUS.md
          if-no-files-found: error
          retention-days: 30
