name: Code Dump v1.2.0 Multi-Audit Build

on:
  push:
    branches: [ codedump-multiaudit-filetypes-07092026 ]
    paths:
      - 'codedump/multiaudit-upgrade/**'
      - 'codedump/package.json'
      - 'codedump/android-release.json'
      - '.github/workflows/codedump-multiaudit-filetypes-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codedump-multiaudit-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    name: Verify multi-audit upgrade and build Android artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialise verified Code Dump 1.0.0 audit baseline
        shell: bash
        run: |
          set -euo pipefail
          cd codedump
          cat overlay-chunks/overlay.{00..13} overlay-chunks/overlay.14a overlay-chunks/overlay.14b overlay-chunks/overlay.14c overlay-chunks/overlay.{15..17} > /tmp/codedump-green-overlay.tar.gz.b64
          test "$(wc -c < /tmp/codedump-green-overlay.tar.gz.b64)" -eq 104336
          test "$(sha256sum /tmp/codedump-green-overlay.tar.gz.b64 | awk '{print $1}')" = "06d888899f0a3f67ca4254aef7fc81af9d9c9eeaf90205791fdb204c87082a67"
          base64 --decode /tmp/codedump-green-overlay.tar.gz.b64 > /tmp/codedump-green-overlay.tar.gz
          test "$(sha256sum /tmp/codedump-green-overlay.tar.gz | awk '{print $1}')" = "b3028e80b7cac2308c105337c020d3a66ecde12e3dfa094ca6f6bdbe18d7e87f"
          tar -xzf /tmp/codedump-green-overlay.tar.gz

          sha256sum -c <<'BASELINE'
          e5088f7a46c801b46754888c34ea84d73b8bf2d0d22063fd2f7aad6b513f2258  web/app.css
          e6efae9807c416ddff0c2e834e78f4f15e8093c40ed0a74071fae9df1d7ce273  web/app.js
          d2ab0bfd774bd8fcee02d5ba2f682d9d11b4ba318d35f69b435746b55fa3b31b  web/archive-core.js
          6f5dae37a3321d18feb93837088adc5d7a19f31d9097aa745c190b0594e725d1  web/core.js
          e6f4879325a198badf0ab4d515c2a46b021c4d55b3e12b76c4d8fe35d15ded06  web/index.html
          5fbc77deec8bda1a20655dc77fd18b9ccae92070b3c3fa5eb5316dd0f230c318  web/platform.js
          1971f5e6181d4eda542a3d00497e72d0892a1befab4426f07e14d0ea3992a55c  native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          BASELINE

          mkdir -p audit-upgrade
          cat audit-upgrade-payload/upgrade.tar.gz.b64.* | tr -d '\n' | base64 --decode > /tmp/audit-upgrade.tar.gz
          test "$(sha256sum /tmp/audit-upgrade.tar.gz | awk '{print $1}')" = "c1ff012daad44eb4e44bcf912d1765a5176a17d97ba90e97b16df1966456bd82"
          tar -xzf /tmp/audit-upgrade.tar.gz -C audit-upgrade
          test "$(sha256sum audit-upgrade/runtime.patch | awk '{print $1}')" = "4596d9e9edf0d508fd72d49fd81f8e8a8ae14ddadc29259e4a0041cb2c413e36"
          (
            cd web
            patch --batch -p0 < ../audit-upgrade/runtime.patch
          )
          cp audit-upgrade/audit-pack.js web/audit-pack.js
          test "$(sha256sum web/audit-pack.js | awk '{print $1}')" = "70ce915752840b80a185b90ff8236d51e64d4a68797393cb462c52c519df9545"

      - name: Apply verified Audit Pack 1.0.1 baseline fix
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum audit-hotfix/audit-pack-1.0.1.patch | awk '{print $1}')" = "56ff27f37252727c1d83aaae5b03bd48e98a13ec6066c2c0a9247743c6897062"
          test "$(sha256sum audit-hotfix/audit-pack-1.0.1-test.patch | awk '{print $1}')" = "e1bde20dad1a0e994ef90b9b6ea808b79a096cb11515177fedb6f0d512c8ab05"
          (
            cd web
            patch --batch -p0 < ../audit-hotfix/audit-pack-1.0.1.patch
          )
          (
            cd audit-upgrade
            patch --batch -p0 < ../audit-hotfix/audit-pack-1.0.1-test.patch
          )
          test "$(sha256sum web/audit-pack.js | awk '{print $1}')" = "94f088a2755991fa55e641e9c2da843175488fd7ec5b91a296ebb44eef051fa8"
          test "$(sha256sum audit-upgrade/audit-pack.test.cjs | awk '{print $1}')" = "929649ff9d711bb68944077aa55a8117ab8a183401f23d5f102a09717df408c9"

      - name: Apply and verify Code Dump 1.2.0 multi-audit upgrade
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < multiaudit-upgrade/payload.b64.00)" -eq 12000
          test "$(wc -c < multiaudit-upgrade/payload.b64.01)" -eq 12000
          test "$(wc -c < multiaudit-upgrade/payload.b64.02)" -eq 8576
          test "$(sha256sum multiaudit-upgrade/payload.b64.00 | awk '{print $1}')" = "440a33ad66beae721db030616e5c0a8e1cac55b9b60b4d3bb89342017fb2f9b8"
          test "$(sha256sum multiaudit-upgrade/payload.b64.01 | awk '{print $1}')" = "83799d7c4198226dcb3c9b1cd39feeb7c69f154587051bce198bbbb70f7c6103"
          test "$(sha256sum multiaudit-upgrade/payload.b64.02 | awk '{print $1}')" = "1e0a301a90a47ee47174b83c6e97334a238120bb1ed8fce26b324a44c9261931"
          cat multiaudit-upgrade/payload.b64.* > /tmp/multiaudit-upgrade.tar.gz.b64
          test "$(wc -c < /tmp/multiaudit-upgrade.tar.gz.b64)" -eq 32576
          base64 --decode /tmp/multiaudit-upgrade.tar.gz.b64 > /tmp/multiaudit-upgrade.tar.gz
          test "$(sha256sum /tmp/multiaudit-upgrade.tar.gz | awk '{print $1}')" = "7e97cb996e3684bbfb9207a493967979515dcbd08c8c3a79ae1fe4ac91c778b1"
          tar -tzf /tmp/multiaudit-upgrade.tar.gz >/dev/null
          mkdir -p multiaudit-upgrade/materialised
          tar -xzf /tmp/multiaudit-upgrade.tar.gz -C multiaudit-upgrade/materialised
          test "$(sha256sum multiaudit-upgrade/materialised/multiaudit-web.patch | awk '{print $1}')" = "900eaa28bc5378789111bc7481c3d364740fe0caf662d9ade27a997a26970862"
          test "$(sha256sum multiaudit-upgrade/materialised/audit-pack.test.cjs | awk '{print $1}')" = "d503301a97e6608bfd346a279c8aca7f5673bcf1094378d77d462a9ddfc73bc4"
          patch --batch -p1 < multiaudit-upgrade/materialised/multiaudit-web.patch
          cp multiaudit-upgrade/materialised/audit-pack.test.cjs audit-upgrade/audit-pack.test.cjs

          sha256sum -c <<'UPGRADED'
          f653a7041be6629b751208c226d4110f20673b592ec935777fd31f58b2a65120  web/app.css
          9daf81e703974cf9c47198523aa1f37ebd0c8ddcab93d670f8a6801ef8479da8  web/app.js
          d2ab0bfd774bd8fcee02d5ba2f682d9d11b4ba318d35f69b435746b55fa3b31b  web/archive-core.js
          eddc76c880366a410002ead0487674568af9d26624ef7d56da7b23118d3b3334  web/audit-pack.js
          a0b0f2adf168bc71d3bc9f73c02bd2e153ee98e8d9abf3ac3a03d29b554ec6ad  web/core.js
          1a3090cd9e31947fdc62c28a2a98260bafed7e108e7780a607ce64f10ad98ab7  web/index.html
          5fbc77deec8bda1a20655dc77fd18b9ccae92070b3c3fa5eb5316dd0f230c318  web/platform.js
          d85043df51cc40968b7bac30aed473e989745df2ad6e2c769bbb3e75da7d42ea  web/sw.js
          UPGRADED

          grep -q "GENERATOR_VERSION = '1.1.0'" web/audit-pack.js
          grep -q 'NO FEATURE MAY BE MARKED PASS MERELY BECAUSE IMPLEMENTATION CODE EXISTS' web/audit-pack.js
          grep -q 'audit-e2e' web/app.js
          grep -q 'audit-uiux' web/app.js
          grep -q 'audit-security' web/app.js
          grep -q 'audit-release' web/app.js
          grep -q 'End-to-End App Acceptance' web/index.html
          grep -q 'UI / UX + Mobile' web/index.html
          grep -q 'Build / Deployment / Release' web/index.html

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run JavaScript and audit regression verification
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          node --check web/core.js
          node --check web/audit-pack.js
          node --check web/app.js
          node --check web/platform.js
          node --check web/archive-core.js
          node --check web/archive-worker.js
          node --check web/sw.js
          node audit-upgrade/audit-pack.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('audit-upgrade/audit-pack.config.example.json','utf8'))"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Install pinned Capacitor and JSZip dependencies
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save jszip@3.10.1
          node -e "for (const [p,v] of [['@capacitor/core','8.5.0'],['@capacitor/android','8.5.0'],['@capacitor/cli','8.5.0'],['jszip','3.10.1']]) if(require('./node_modules/'+p+'/package.json').version!==v) process.exit(1)"
          mkdir -p web/vendor
          cp node_modules/jszip/dist/jszip.min.js web/vendor/jszip.min.js

      - name: Prepare and verify Android project
        working-directory: codedump
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android.mjs
          test -f android/gradlew
          test -f android/app/src/main/java/app/codedump/tool/MainActivity.kt
          test -f android/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          grep -q "com.android.tools.build:gradle:8.13.2" android/build.gradle
          grep -q "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20" android/build.gradle
          grep -q "androidx.documentfile:documentfile:1.1.0" android/app/build.gradle
          grep -q "versionCode 3" android/app/build.gradle
          grep -q 'versionName "1.2.0"' android/app/build.gradle
          grep -q "GENERATOR_VERSION = '1.1.0'" android/app/src/main/assets/public/audit-pack.js
          test "$(sha256sum android/app/src/main/assets/public/audit-pack.js | awk '{print $1}')" = "eddc76c880366a410002ead0487674568af9d26624ef7d56da7b23118d3b3334"
          test "$(sha256sum android/app/src/main/assets/public/core.js | awk '{print $1}')" = "a0b0f2adf168bc71d3bc9f73c02bd2e153ee98e8d9abf3ac3a03d29b554ec6ad"
          test "$(sha256sum android/app/src/main/assets/public/app.js | awk '{print $1}')" = "9daf81e703974cf9c47198523aa1f37ebd0c8ddcab93d670f8a6801ef8479da8"

      - name: Run unit tests, lint and Android builds
        working-directory: codedump/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease

      - name: Stage build artefacts and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp codedump/android/app/build/outputs/apk/debug/app-debug.apk artifacts/
          find codedump/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} artifacts/ \;
          find codedump/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} artifacts/ \;
          {
            echo "Carrier repository: $GITHUB_REPOSITORY"
            echo "Carrier commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Code Dump version: 1.2.0"
            echo "Application ID: app.codedump.tool"
            echo "10-Phase LLM Audit Pack Generator: 1.1.0"
            echo "Focused audits: End-to-End App Acceptance; UI / UX + Mobile; Security; Build / Deployment / Release"
            echo "Multi-audit upgrade payload SHA-256: 7e97cb996e3684bbfb9207a493967979515dcbd08c8c3a79ae1fe4ac91c778b1"
            echo "Multi-audit source patch SHA-256: 900eaa28bc5378789111bc7481c3d364740fe0caf662d9ade27a997a26970862"
            echo "Audit regression suite SHA-256: d503301a97e6608bfd346a279c8aca7f5673bcf1094378d77d462a9ddfc73bc4"
            echo "Audit engine SHA-256: eddc76c880366a410002ead0487674568af9d26624ef7d56da7b23118d3b3334"
            echo "Core SHA-256: a0b0f2adf168bc71d3bc9f73c02bd2e153ee98e8d9abf3ac3a03d29b554ec6ad"
            echo "App SHA-256: 9daf81e703974cf9c47198523aa1f37ebd0c8ddcab93d670f8a6801ef8479da8"
            echo "Index SHA-256: 1a3090cd9e31947fdc62c28a2a98260bafed7e108e7780a607ce64f10ad98ab7"
            echo "Service worker SHA-256: d85043df51cc40968b7bac30aed473e989745df2ad6e2c769bbb3e75da7d42ea"
            echo "Capacitor: 8.5.0"
            echo "JSZip: 3.10.1"
            echo "AGP: 8.13.2"
            echo "Kotlin: 2.3.20"
            echo "Java: 21"
            echo "Android: API 36 / Build Tools 36.0.0"
          } > artifacts/BUILD_INFO.txt
          (cd artifacts && sha256sum *.apk *.aab BUILD_INFO.txt 2>/dev/null | sort > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload Code Dump 1.2.0 Android artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-dump-v1.2.0-multiaudit-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
