name: Recovery Expo SDK 57 Alignment Once

on:
  push:
    branches:
      - ux-regression-recovery-03092026
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  align:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Align Expo SDK 57 dependencies'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux-regression-recovery-03092026
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current lockfile exactly
        run: npm ci --no-fund

      - name: Align only Expo packages required by SDK 57 compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --save \
            'expo@~57.0.19' \
            'expo-asset@~57.0.16' \
            'expo-build-properties@~57.0.16' \
            'expo-constants@~57.0.17' \
            'expo-image-picker@~57.0.15' \
            'expo-secure-store@~57.0.3' \
            'expo-sharing@~57.0.17'

      - name: Recalculate existing fail-closed integrity seals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          manifests = [Path('HANDOVER_SHA256SUMS.txt'), Path('SHA256SUMS_EXEC002.txt')]
          pattern = re.compile(r'^([0-9a-fA-F]{64})(\s+)(.+)$')
          for manifest in manifests:
              if not manifest.is_file():
                  raise SystemExit(f'missing integrity manifest: {manifest}')
              output = []
              for line_no, raw in enumerate(manifest.read_text(encoding='utf-8').splitlines(), 1):
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      output.append(raw)
                      continue
                  match = pattern.match(raw)
                  if not match:
                      raise SystemExit(f'{manifest}:{line_no}: malformed checksum line')
                  filename = match.group(3)
                  target = Path(filename)
                  if not target.is_file():
                      raise SystemExit(f'{manifest}:{line_no}: sealed file missing: {filename}')
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  output.append(f'{digest}  {filename}')
              manifest.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Expo compatibility gate
        run: npx expo install --check

      - name: Fail-closed static verification
        run: npm run check

      - name: Full regression suite with no skips
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee recovery-expo-align-tests.txt
          if grep -Eiq '(^# skipped [1-9]|# SKIP|\bSKIP\b)' recovery-expo-align-tests.txt; then
            echo 'Regression test skip detected.' >&2
            exit 1
          fi

      - name: Restrict alignment diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package\.json|package-lock\.json|HANDOVER_SHA256SUMS\.txt|SHA256SUMS_EXEC002\.txt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed during dependency alignment:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$changed"

      - name: Commit validated alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json HANDOVER_SHA256SUMS.txt SHA256SUMS_EXEC002.txt
          git commit -m 'Align Expo SDK 57 dependencies'
          git push origin HEAD:ux-regression-recovery-03092026

      - name: Dispatch fail-closed recovery APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_REF: ux-regression-recovery-03092026
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"%s","inputs":{"signing_mode":"preview","run_emulator_checks":"true","publish_diagnostic_artifact":"false"}}' "$RECOVERY_REF")
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/android-apk.yml/dispatches" \
            -d "$payload"
          echo 'RECOVERY_APK_REDISPATCH=PASS'
