name: UX Recovery APK Dispatch

on:
  push:
    branches:
      - ux-regression-recovery-03092026
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch-recovery-apk:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux-regression-recovery-03092026
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci --no-fund

      - name: Repair emulator acceleration precondition narrowly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/android-apk.yml')
          text=path.read_text(encoding='utf-8')
          old='''      - name: Enable KVM access for Android emulators
        if: ${{ env.RUN_EMULATOR_CHECKS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
'''
          new='''      - name: Select Android emulator acceleration safely
        if: ${{ env.RUN_EMULATOR_CHECKS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTICS_DIR"
          ls -l /dev/kvm > "$DIAGNOSTICS_DIR/kvm.txt" 2>&1 || true
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm || true; fi
          "$ANDROID_HOME/emulator/emulator" -accel-check > "$DIAGNOSTICS_DIR/emulator-accel-check.txt" 2>&1 || true
          mode=off
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then mode=on; fi
          echo "EMULATOR_ACCEL_MODE=$mode" | tee "$DIAGNOSTICS_DIR/emulator-accel-mode.txt"
          echo "EMULATOR_ACCEL_MODE=$mode" >> "$GITHUB_ENV"
'''
          if old in text:
              text=text.replace(old,new,1)
              needle='-no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader_indirect'
              if text.count(needle) != 2:
                  raise SystemExit(f'expected two emulator launch sites, found {text.count(needle)}')
              text=text.replace(needle,'-no-window -no-audio -no-boot-anim -no-snapshot -accel "$EMULATOR_ACCEL_MODE" -gpu swiftshader_indirect')
              path.write_text(text,encoding='utf-8')
          elif 'Select Android emulator acceleration safely' not in text or text.count('-accel "$EMULATOR_ACCEL_MODE"') != 2:
              raise SystemExit('Android workflow differs from expected old/repaired forms')
          PY
          git diff --check -- .github/workflows/android-apk.yml

      - name: Reseal existing integrity manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          pat=re.compile(r'^([0-9a-fA-F]{64})(\s+)(.+)$')
          for manifest in map(Path,['HANDOVER_SHA256SUMS.txt','SHA256SUMS_EXEC002.txt']):
              out=[]
              for n,raw in enumerate(manifest.read_text(encoding='utf-8').splitlines(),1):
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      out.append(raw); continue
                  m=pat.match(raw)
                  if not m: raise SystemExit(f'{manifest}:{n}: malformed checksum line')
                  target=Path(m.group(3))
                  if not target.is_file(): raise SystemExit(f'{manifest}:{n}: sealed file missing: {target}')
                  out.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {m.group(3)}')
              manifest.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Re-prove recovery product/source gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test 2>&1 | tee recovery-dispatch-tests.txt
          grep -F 'ℹ tests 149' recovery-dispatch-tests.txt
          grep -F 'ℹ pass 149' recovery-dispatch-tests.txt
          grep -F 'ℹ fail 0' recovery-dispatch-tests.txt
          grep -F 'ℹ skipped 0' recovery-dispatch-tests.txt
          grep -F 'legacy PIN gate and throttle startup behaviour cannot reappear' recovery-dispatch-tests.txt
          grep -F 'normal startup remains unlocked unless optional app lock is enabled and due' recovery-dispatch-tests.txt
          grep -F 'optional device-authentication app-lock controls remain available in settings' recovery-dispatch-tests.txt
          grep -F 'protected AI settings use device authentication rather than a PIN modal' recovery-dispatch-tests.txt

      - name: Commit only technical workflow/integrity repair when needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/android-apk\.yml|HANDOVER_SHA256SUMS\.txt|SHA256SUMS_EXEC002\.txt)$' || true)"
          if [[ -n "$unexpected" ]]; then printf '%s\n' "$unexpected" >&2; exit 1; fi
          if git diff --quiet -- .github/workflows/android-apk.yml HANDOVER_SHA256SUMS.txt SHA256SUMS_EXEC002.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/android-apk.yml HANDOVER_SHA256SUMS.txt SHA256SUMS_EXEC002.txt
          git commit -m 'CI: allow emulator software-acceleration fallback'
          git push origin HEAD:ux-regression-recovery-03092026
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch fail-closed APK workflow for exact recovery ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_REF: ux-regression-recovery-03092026
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.commit.outputs.changed }}" == 'true' ]]; then sleep 3; fi
          payload=$(printf '{"ref":"%s","inputs":{"signing_mode":"preview","run_emulator_checks":"true","publish_diagnostic_artifact":"false"}}' "$RECOVERY_REF")
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/android-apk.yml/dispatches" \
            -d "$payload"
          echo "RECOVERY_APK_DISPATCH=PASS"
