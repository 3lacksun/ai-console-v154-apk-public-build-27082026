name: UX Recovery APK Dispatch

on:
  push:
    branches:
      - ux-regression-recovery-03092026
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-recovery-apk:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch fail-closed APK workflow for exact recovery ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_REF: ux-regression-recovery-03092026
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"%s","inputs":{"signing_mode":"preview","run_emulator_checks":"true","publish_diagnostic_artifact":"false"}}' "$RECOVERY_REF")
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/android-apk.yml/dispatches" \
            -d "$payload"
          echo "RECOVERY_APK_DISPATCH=PASS"
