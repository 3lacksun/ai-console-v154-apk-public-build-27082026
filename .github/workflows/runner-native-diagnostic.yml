name: Runner Native Diagnostic

on:
  push:
    branches:
      - v154-runner-isolation-02092026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-native-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install current repository dependencies
        run: npm ci --no-fund

      - name: Converge stale public-repo Expo dependencies in runner only
        run: |
          set -euo pipefail
          npx expo install --fix
          npx expo install --check

      - name: Static and test gates
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Install Android API 36 build prerequisites
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Expo prebuild
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify and normalise generated Gradle properties
        run: |
          set -euo pipefail
          grep -RInE 'compileSdk(Version)?[ =]+36|compileSdk[[:space:]]+36' android
          grep -RInE 'targetSdk(Version)?[ =]+36|targetSdk[[:space:]]+36' android
          printf '\norg.gradle.workers.max=1\norg.gradle.parallel=false\norg.gradle.daemon=false\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          grep -Fx 'android.buildToolsVersion=36.0.0' android/gradle.properties
          grep -Fx 'org.gradle.workers.max=1' android/gradle.properties

      - name: Gradle debug APK
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew app:assembleDebug --no-daemon --max-workers=1 --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: v154-public-repo-native-diagnostic-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
