          sleep 20
          P="$(timeout 10 adb -s emulator-5554 shell pidof "$PKG" | tr -d '\r' || true)"
          echo "PID=$P" | tee "$E/pid.txt"
          test -n "$P"
          timeout 15 adb -s emulator-5554 shell dumpsys activity activities > "$E/activities.txt"
          grep -F "$PKG" "$E/activities.txt" | head -40
          timeout 20 adb -s emulator-5554 logcat -d -v threadtime > "$E/logcat.txt" || true
          if grep -E "FATAL EXCEPTION|Process: ${PKG}([,[:space:]]|$)" "$E/logcat.txt"; then exit 50; fi
          echo 'ANDROID_16KB_COLD_LAUNCH=PASS' | tee "$E/result.txt"
      - name: Capture 16 KB diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-evidence/page16k
          timeout 5 adb devices -l > runtime-evidence/page16k/adb-devices-final.txt 2>&1 || true
          ps auxww | grep -E '[e]mulator|[q]emu' > runtime-evidence/page16k/processes.txt 2>&1 || true
          timeout 10 adb -s emulator-5554 logcat -d -v threadtime > runtime-evidence/page16k/logcat-final.txt 2>&1 || true
          tail -300 runtime-evidence/page16k/emulator.log > runtime-evidence/page16k/emulator-tail.txt 2>&1 || true
          timeout 5 adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
      - name: Upload 16 KB evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DR_STONES_COMMAND_CENTRE_V1_5_4_16KB_KVM_EVIDENCE
          path: runtime-evidence/page16k
          if-no-files-found: warn
          retention-days: 14
