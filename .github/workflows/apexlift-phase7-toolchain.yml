name: ApexLift Phase 7 Offline Toolchain

on:
  push:
    branches:
      - apexlift-phase7-toolchain-25092026
    paths:
      - .github/workflows/apexlift-phase7-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download exact Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  gradle-8.13-bin.zip" | sha256sum -c -
          unzip -q gradle-8.13-bin.zip

      - name: Resolve exact ApexLift build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resolver/app/src/main/java/com/lowertraining/app resolver/app/src/main/res/values
          cat > resolver/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ApexLiftDependencyResolver"
          include(":app")
          EOF
          cat > resolver/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false
          }
          EOF
          cat > resolver/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > resolver/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.lowertraining.app"
              compileSdk = 36
              buildToolsVersion = "36.0.0"
              defaultConfig {
                  applicationId = "com.lowertraining.app"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 6
                  versionName = "1.3.2"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.05.01")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          cat > resolver/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > resolver/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > resolver/app/src/main/java/com/lowertraining/app/MainActivity.kt <<'EOF'
          package com.lowertraining.app
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("ApexLift dependency resolver") }
              }
          }
          EOF
          export GRADLE_USER_HOME="$PWD/gradle-user-home"
          ./gradle-8.13/bin/gradle -p resolver --no-daemon --stacktrace clean :app:assembleDebug
          rm -rf resolver/.gradle resolver/app/build resolver/build
          ./gradle-8.13/bin/gradle -p resolver --offline --no-daemon --stacktrace :app:assembleDebug

      - name: Package offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gradle-user-home/daemon gradle-user-home/.tmp || true
          mkdir -p bundle/sdk
          cp gradle-8.13-bin.zip bundle/
          cp -a "${ANDROID_HOME}/platforms" bundle/sdk/
          mkdir -p bundle/sdk/build-tools
          cp -a "${ANDROID_HOME}/build-tools/36.0.0" bundle/sdk/build-tools/
          cp -a "${ANDROID_HOME}/platform-tools" bundle/sdk/
          if [[ -d "${ANDROID_HOME}/licenses" ]]; then cp -a "${ANDROID_HOME}/licenses" bundle/sdk/; fi
          tar -C gradle-user-home -czf bundle/gradle-user-home.tgz .
          tar -C bundle/sdk -czf bundle/android-sdk-36.tgz .
          rm -rf bundle/sdk
          {
            echo "gradle=8.13"
            echo "gradle_sha256=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
            echo "agp=8.11.1"
            echo "kotlin=2.2.21"
            echo "compose_bom=2025.05.01"
            echo "build_tools=36.0.0"
            echo "compile_sdk=36"
            echo "target_sdk=36"
            echo "min_sdk=26"
            java -version 2>&1 | head -1
          } > bundle/TOOLCHAIN_METADATA.txt
          (cd bundle && sha256sum gradle-8.13-bin.zip gradle-user-home.tgz android-sdk-36.tgz TOOLCHAIN_METADATA.txt > SHA256SUMS.txt)
          du -h bundle/*

      - name: Upload exact offline toolchain
        uses: actions/upload-artifact@v4
        with:
          name: apexlift-phase7-offline-toolchain
          path: bundle/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
