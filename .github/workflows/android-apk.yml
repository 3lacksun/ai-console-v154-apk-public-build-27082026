name: Generic Android 36 Toolchain Seed

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

      - name: Resolve exact Capacitor and Android dependency graph
        shell: bash
        run: |
          set -euo pipefail
          SEED=/tmp/turncall-generic-seed
          rm -rf "$SEED"
          mkdir -p "$SEED/www"
          cd "$SEED"
          cat > package.json <<'JSON'
          {
            "name": "turncall-generic-toolchain-seed",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@aparajita/capacitor-secure-storage": "8.0.0",
              "@capacitor/android": "8.5.0",
              "@capacitor/app": "8.0.0",
              "@capacitor/camera": "8.0.0",
              "@capacitor/core": "8.5.0",
              "@capacitor/haptics": "8.0.0",
              "@capacitor/keyboard": "8.0.0",
              "@capacitor/local-notifications": "8.0.0",
              "@capacitor/network": "8.0.0",
              "@capacitor/preferences": "8.0.0",
              "@capacitor/status-bar": "8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.0",
              "typescript": "5.7.3"
            }
          }
          JSON
          printf '<!doctype html><html><body>generic toolchain seed</body></html>\n' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"im.turncall.toolchain.seed","appName":"Toolchain Seed","webDir":"www"}
          JSON
          npm install --no-fund --no-audit
          test "$(node node_modules/@capacitor/cli/bin/capacitor --version)" = "8.5.0"
          node node_modules/@capacitor/cli/bin/capacitor add android
          node node_modules/@capacitor/cli/bin/capacitor sync android
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -q "classpath 'com.android.tools.build:gradle:8.13.0'" android/build.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          ./gradlew --version | tee /tmp/gradle-version.txt
          grep -q 'Gradle 8.14.3' /tmp/gradle-version.txt
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Package generic Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turncall-toolchain
          cd "$ANDROID_HOME"
          tar -czf /tmp/turncall-toolchain/android-sdk36-buildtools36.tar.gz platforms/android-36 build-tools/36.0.0 licenses
          sha256sum /tmp/turncall-toolchain/android-sdk36-buildtools36.tar.gz > /tmp/turncall-toolchain/android-sdk36-buildtools36.tar.gz.sha256
          du -h /tmp/turncall-toolchain/android-sdk36-buildtools36.tar.gz

      - name: Package Gradle distribution and dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turncall-toolchain
          cd "$HOME/.gradle"
          tar -czf /tmp/turncall-toolchain/gradle8143-capacitor850-cache.tar.gz wrapper/dists caches
          sha256sum /tmp/turncall-toolchain/gradle8143-capacitor850-cache.tar.gz > /tmp/turncall-toolchain/gradle8143-capacitor850-cache.tar.gz.sha256
          du -h /tmp/turncall-toolchain/gradle8143-capacitor850-cache.tar.gz
          cat > /tmp/turncall-toolchain/TOOLCHAIN_MANIFEST.txt <<'EOF'
          Generic build toolchain only. No TurnCall application source or credentials are included.
          Java 21; Node 22; Capacitor 8.5.0; Gradle 8.14.3-all; AGP 8.13.0; Android API 36; Build Tools 36.0.0.
          Seed plugins: secure-storage 8.0.0 and Capacitor app/camera/haptics/keyboard/local-notifications/network/preferences/status-bar 8.0.0.
          EOF

      - name: Upload Android SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: generic-android-sdk36-buildtools36
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/turncall-toolchain/android-sdk36-buildtools36.tar.gz
            /tmp/turncall-toolchain/android-sdk36-buildtools36.tar.gz.sha256
            /tmp/turncall-toolchain/TOOLCHAIN_MANIFEST.txt

      - name: Upload Gradle cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: generic-gradle8143-capacitor850-cache
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/turncall-toolchain/gradle8143-capacitor850-cache.tar.gz
            /tmp/turncall-toolchain/gradle8143-capacitor850-cache.tar.gz.sha256
            /tmp/turncall-toolchain/TOOLCHAIN_MANIFEST.txt
